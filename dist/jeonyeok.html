<style>
/* 전역각 — 스타일
 * 레이아웃: 휴대폰 세로 한 화면. 위는 계급줄·스탯(올리브 명찰 띠), 가운데는 넘기는 카드, 아래는 도크.
 * 컨셉: 국방색 + 카키 종이 + 놋쇠 계급장 + 빨간 직인. 한 가지 세계관으로 고정(다크모드 없음).
 */
:root {
  --khaki: #d9cfac;        /* 바탕: 카키 종이 */
  --paper: #f6f0dc;        /* 카드·쪽지 종이 */
  --ink: #2a2620;          /* 글자 */
  --olive: #56662f;        /* 국방색 */
  --olive-dark: #333d1d;   /* 짙은 국방색 띠 */
  --brass: #e0b347;        /* 놋쇠 계급장 */
  --stamp: #c4362b;        /* 빨간 직인 */
  --good: #3d8a4a;
  --muted: #7b7358;
  --cream: #efe8cc;
  --shadow: rgba(42, 38, 32, .28);

  --font-display: 'Black Han Sans', 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-body: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
  --font-util: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;

  --r-lg: 18px;
  --r-md: 12px;
  --r-sm: 8px;
  color-scheme: light;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; box-sizing: border-box; background: var(--khaki); overflow: hidden; }
body {
  height: 100%;
  margin: 0;
  background: var(--khaki);
  background-image:
    repeating-linear-gradient(45deg, rgba(90, 80, 50, .045) 0 2px, transparent 2px 6px),
    repeating-linear-gradient(-45deg, rgba(90, 80, 50, .035) 0 2px, transparent 2px 7px);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  word-break: keep-all;
  overflow-wrap: break-word;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
  overflow: hidden;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }
[hidden] { display: none !important; }

#app { height: 100%; position: relative; overflow: hidden; } /* 날아가는 카드가 화면 밖으로 넘쳐 모바일 브라우저가 축소되는 것 방지 */
.screen {
  height: 100%;
  display: flex;
  flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  max-width: 560px;
  margin: 0 auto;
}

/* ── 버튼 ─────────────────────────── */
.btn {
  border: 3px solid var(--ink);
  border-radius: 999px;
  padding: 12px 22px;
  background: var(--paper);
  font-size: 18px;
  box-shadow: 0 4px 0 var(--ink);
  transition: transform .08s, box-shadow .08s;
  touch-action: manipulation;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn-primary { background: var(--olive); color: var(--cream); }
.btn-ghost { background: transparent; box-shadow: none; border-width: 2px; }
.btn-ghost:active { transform: none; background: rgba(0, 0, 0, .06); }
.btn-small { font-size: 14px; padding: 6px 14px; border-width: 2px; box-shadow: 0 3px 0 var(--ink); }

/* ── 타이틀 ───────────────────────── */
.title-screen { justify-content: space-between; text-align: center; gap: 8px; }
.title-top { padding-top: 4vh; }
.eyebrow { margin: 0; font-size: 13px; letter-spacing: .12em; color: var(--muted); }
.logo {
  margin: 2px 0 0;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(76px, 26vw, 128px);
  line-height: 1;
  color: var(--olive-dark);
  letter-spacing: -.02em;
  text-shadow: 4px 4px 0 var(--brass), 8px 8px 0 rgba(42, 38, 32, .2);
}
.logo span {
  display: inline-block;
  color: var(--stamp);
  transform: rotate(-8deg) translateY(-6px);
  text-shadow: 3px 3px 0 var(--ink);
}
.tagline { margin: 10px 0 0; font-size: 15px; color: var(--muted); }
.title-crowd {
  flex: 1;
  min-height: 140px;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  gap: 0;
  overflow: hidden;
}
.title-crowd { position: relative; }
.title-crowd .peek { width: 34%; max-width: 190px; margin: 0 -4%; }
.title-crowd .peek:nth-child(2) { width: 42%; max-width: 230px; z-index: 2; }
.title-bubble {
  position: absolute;
  left: 50%; top: 8%;
  transform: translateX(-50%) rotate(-2deg);
  background: var(--paper);
  border: 3px solid var(--ink);
  border-radius: 18px;
  padding: 8px 16px;
  font-size: 17px;
  white-space: nowrap;
  box-shadow: 3px 3px 0 var(--shadow);
  z-index: 3;
  animation: bubble 3s ease-in-out infinite;
}
.title-bubble::after {
  content: "";
  position: absolute; left: 50%; bottom: -14px;
  width: 18px; height: 18px;
  background: var(--paper);
  border-right: 3px solid var(--ink); border-bottom: 3px solid var(--ink);
  transform: translateX(-50%) rotate(45deg);
}
@keyframes bubble { 0%, 100% { transform: translateX(-50%) rotate(-2deg); } 50% { transform: translateX(-50%) rotate(1deg) translateY(-3px); } }
.title-crowd .peek:nth-child(1) .char { animation-delay: -.4s; }
.title-crowd .peek:nth-child(3) .char { animation-delay: -.8s; }
.title-crowd .char { width: 100%; height: auto; display: block; }
.title-actions { display: flex; flex-direction: column; gap: 12px; align-items: stretch; width: min(100%, 340px); margin: 0 auto; }
.save-info { margin: -4px 0 0; font-size: 14px; color: var(--muted); }
.fine { font-size: 12px; color: var(--muted); margin: 6px auto 0; max-width: 32em; text-wrap: balance; }

/* ── 입영 통지서 ───────────────────── */
.setup-screen { overflow-y: auto; padding-block: 14px 24px; }
.notice {
  position: relative;
  background: var(--paper);
  border: 2px solid var(--ink);
  border-radius: 6px;
  padding: 18px 18px 22px;
  box-shadow: 6px 6px 0 var(--shadow);
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.notice::before {
  content: "";
  position: absolute;
  inset: 6px;
  border: 1px solid rgba(42, 38, 32, .35);
  pointer-events: none;
}
.notice-head { text-align: center; border-bottom: 3px double var(--ink); padding-bottom: 10px; }
.notice-head h2 { margin: 2px 0; font-family: var(--font-display); font-weight: 400; font-size: 26px; letter-spacing: .06em; text-wrap: balance; }
.notice-org { font-size: 13px; color: var(--muted); letter-spacing: .3em; }
.notice-no { font-family: var(--font-util); font-size: 12px; color: var(--muted); }
.notice-face { display: flex; align-items: center; gap: 14px; }
.face-preview {
  width: 112px; height: 128px; flex: none;
  border: 2px solid var(--ink);
  background: #c9d6dc;
  overflow: hidden;
  border-radius: 4px;
}
.face-preview .char { width: 100%; height: 100%; display: block; }
.field { display: flex; flex-direction: column; gap: 6px; border: 0; padding: 0; margin: 0; min-width: 0; }
.field > span, .field legend { font-size: 13px; color: var(--muted); letter-spacing: .1em; padding: 0; }
.field input {
  border: 0;
  border-bottom: 2px solid var(--ink);
  background: transparent;
  font-size: 20px;
  padding: 4px 2px;
  border-radius: 0;
  min-width: 0;
  width: 100%;
}
.field input:focus { outline: none; border-bottom-color: var(--olive); background: rgba(86, 102, 47, .08); }
.field-note { margin: -8px 0 0; font-size: 13px; color: var(--olive); font-family: var(--font-util); }
.mos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.mos {
  display: flex; flex-direction: column; gap: 2px;
  border: 2px solid var(--ink);
  border-radius: var(--r-sm);
  padding: 8px 10px;
  background: transparent;
  text-align: left;
  min-width: 0;
}
.mos:last-child:nth-child(odd) { grid-column: 1 / -1; }
.mos b { font-size: 16px; font-weight: 400; }
.mos small { font-size: 12px; color: var(--muted); line-height: 1.3; }
.mos[aria-pressed="true"] { background: var(--olive); color: var(--cream); }
.mos[aria-pressed="true"] small { color: var(--cream); opacity: .85; }
.pace-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pace { position: relative; min-width: 0; }
.pace input { position: absolute; opacity: 0; inset: 0; }
.pace span {
  display: flex; flex-direction: column;
  border: 2px solid var(--ink); border-radius: var(--r-sm);
  padding: 8px 10px; height: 100%;
}
.pace b { font-weight: 400; }
.pace small { font-size: 12px; color: var(--muted); }
.pace input:checked + span { background: var(--olive); color: var(--cream); }
.pace input:checked + span small { color: var(--cream); }
.pace input:focus-visible + span { outline: 3px solid var(--brass); }
.notice-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; position: relative; z-index: 2; }
.stamp {
  position: absolute;
  right: 22px; top: 92px;
  width: 78px; height: 78px;
  border: 4px solid var(--stamp);
  border-radius: 50%;
  color: var(--stamp);
  display: grid; place-items: center;
  font-family: var(--font-display);
  font-size: 15px;
  line-height: 1.1;
  text-align: center;
  transform: rotate(-14deg);
  opacity: .78;
  pointer-events: none;
}

/* ── 게임 화면 ─────────────────────── */
.game-screen { padding-block: 8px 6px; gap: 8px; }
.hud {
  background: var(--olive-dark);
  color: var(--cream);
  border-radius: var(--r-lg);
  padding: 10px 12px 8px;
  box-shadow: 0 4px 0 rgba(0, 0, 0, .25);
  flex: none;
}
.hud-row { display: flex; align-items: center; gap: 10px; }
.hud-rank { width: 42px; flex: none; }
.rank-svg { width: 100%; height: auto; display: block; }
.hud-name { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.hud-name b { font-weight: 400; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud-name small { font-size: 12px; opacity: .75; font-family: var(--font-util); }
.hud-dday { text-align: right; display: flex; flex-direction: column; line-height: 1.1; }
.hud-dday small { font-size: 11px; opacity: .7; }
.hud-dday b { font-family: var(--font-display); font-weight: 400; font-size: 26px; color: var(--brass); font-variant-numeric: tabular-nums; }
.gauge { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.gauge-bar { flex: 1; height: 10px; background: rgba(0, 0, 0, .35); border-radius: 99px; overflow: hidden; }
.gauge-bar i {
  display: block; height: 100%; width: 0%;
  background: repeating-linear-gradient(-45deg, var(--brass) 0 8px, #c99a2e 8px 16px);
  border-radius: 99px;
  transition: width .6s ease;
}
.gauge span { font-family: var(--font-util); font-size: 12px; min-width: 4.2em; text-align: right; font-variant-numeric: tabular-nums; }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
.stat { position: relative; display: flex; flex-direction: column; align-items: center; gap: 1px; }
.stat-ic { position: relative; width: 38px; height: 36px; }
.stat-ic .ic-back, .stat-ic .ic-front { position: absolute; inset: 0; }
.stat-ic .stat-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.stat-ic .ic-back path { fill: rgba(0, 0, 0, .35); stroke: rgba(239, 232, 204, .55); stroke-width: 5; }
.stat-ic .ic-front { clip-path: inset(calc(100% - var(--v, 50) * 1%) 0 0 0); transition: clip-path .5s ease; }
.stat-ic .ic-front path { fill: var(--cream); stroke: var(--cream); stroke-width: 5; }
.stat.danger .ic-front path { fill: #ff8a7a; stroke: #ff8a7a; }
.stat.danger .stat-ic { animation: pulse .9s ease-in-out infinite; }
.stat-name { font-size: 11px; opacity: .8; }
.stat .dot {
  position: absolute; top: -7px;
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--brass);
  opacity: 0; transform: scale(.3);
  transition: opacity .15s, transform .15s;
}
.stat .dot.on { opacity: 1; transform: scale(1); }
.stat .dot.big { width: 12px; height: 12px; top: -9px; }
.stat .delta {
  position: absolute; top: 4px;
  font-family: var(--font-display); font-size: 18px;
  pointer-events: none;
  animation: floatUp 1.1s ease-out forwards;
  text-shadow: 0 2px 0 rgba(0, 0, 0, .4);
}
.stat .delta.up { color: #9fe39a; }
.stat .delta.down { color: #ff9a8a; }

.stage { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
.prompt {
  flex: none;
  background: var(--paper);
  border: 2px solid var(--ink);
  border-radius: var(--r-md);
  padding: 9px 12px 10px;
  min-height: 4.6em;
  font-size: 17px;
  line-height: 1.4;
  box-shadow: 3px 3px 0 var(--shadow);
  text-wrap: pretty;
}
.prompt .who { display: inline-block; font-size: 12px; background: var(--olive); color: var(--cream); padding: 1px 8px; border-radius: 99px; margin-bottom: 3px; }

.card-zone { position: relative; flex: 1; min-height: 120px; display: flex; align-items: center; justify-content: center; }
.card {
  position: relative;
  width: 300px; height: 360px;
  border-radius: var(--r-lg);
  border: 3px solid var(--ink);
  background: var(--paper);
  overflow: hidden;
  box-shadow: 0 8px 0 var(--shadow);
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  cursor: grab;
  will-change: transform;
}
.card:active { cursor: grabbing; }
.card.enter { animation: cardIn .38s cubic-bezier(.2, 1.4, .4, 1); }
.card.fly { transition: transform .3s ease-in, opacity .3s; }
.card.back { transition: transform .25s cubic-bezier(.2, 1.4, .4, 1); }
.card .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
.card .char-wrap { position: absolute; left: 6%; right: 6%; bottom: 46px; top: 10%; }
.card .char-wrap .char { width: 100%; height: 100%; display: block; }
.nametape {
  position: absolute; left: 0; right: 0; bottom: 0;
  height: 46px;
  background: var(--olive-dark);
  color: var(--cream);
  display: flex; align-items: center; justify-content: center; gap: 8px;
  border-top: 3px solid var(--ink);
}
.nametape b { font-weight: 400; font-size: 19px; }
.nametape span { font-size: 12px; opacity: .75; }
.card-label {
  position: absolute; top: 12px;
  max-width: 70%;
  background: var(--ink);
  color: var(--paper);
  padding: 6px 12px;
  border-radius: var(--r-sm);
  font-size: 16px;
  line-height: 1.25;
  opacity: 0;
  pointer-events: none;
  transition: opacity .1s;
  z-index: 3;
}
.card-label.l { right: 10px; text-align: right; }
.card-label.r { left: 10px; }
.card-label.mini::after { content: " 🎮"; }

.choices { flex: none; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.choice {
  display: flex; align-items: center; gap: 6px;
  min-height: 48px;
  border: 2px solid var(--ink);
  border-radius: var(--r-md);
  background: var(--paper);
  padding: 6px 10px;
  font-size: 15px;
  line-height: 1.2;
  text-align: left;
  box-shadow: 0 3px 0 var(--ink);
  min-width: 0;
  touch-action: manipulation;
}
.choice b { font-weight: 400; flex: 1; min-width: 0; }
.choice[data-side="r"] { text-align: right; }
.choice span { color: var(--olive); font-size: 13px; }
.choice.armed { background: var(--olive); color: var(--cream); }
.choice.armed span { color: var(--brass); }
.choice:disabled { opacity: .5; }

/* 결과 쪽지 */
.result {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  z-index: 5;
  cursor: pointer;
}
.note {
  position: relative;
  width: min(100%, 340px);
  background: var(--paper);
  border: 2px solid var(--ink);
  border-radius: 6px;
  padding: 22px 18px 14px;
  box-shadow: 5px 6px 0 var(--shadow);
  transform: rotate(-1.2deg);
  animation: noteIn .3s cubic-bezier(.2, 1.3, .4, 1);
  display: flex; flex-direction: column; gap: 10px;
}
.note::before {
  content: "";
  position: absolute; top: -12px; left: 50%;
  width: 90px; height: 24px;
  margin-left: -45px;
  background: rgba(224, 179, 71, .75);
  transform: rotate(2deg);
}
.note p { margin: 0; font-size: 18px; line-height: 1.45; text-wrap: pretty; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font-size: 13px;
  padding: 2px 9px;
  border-radius: 99px;
  border: 2px solid currentColor;
  white-space: nowrap;
}
.chip.up { color: var(--good); }
.chip.down { color: var(--stamp); }
.chip.info { color: var(--olive-dark); background: rgba(86, 102, 47, .12); }
.events { display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--olive-dark); }
.events div { display: flex; gap: 6px; align-items: baseline; }
.tap-next { align-self: flex-end; font-size: 13px; color: var(--muted); animation: blink 1.2s steps(2) infinite; }

.dock {
  flex: none;
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
  background: var(--olive-dark);
  border-radius: var(--r-lg);
  padding: 6px;
}
.dock-btn {
  position: relative;
  border: 0;
  background: transparent;
  color: var(--cream);
  display: flex; flex-direction: column; align-items: center; gap: 0;
  padding: 4px 2px;
  border-radius: var(--r-md);
  touch-action: manipulation;
}
.dock-btn:active { background: rgba(255, 255, 255, .08); }
.dock-btn i { font-style: normal; font-size: 22px; line-height: 1.2; }
.dock-btn span { font-size: 12px; }
.dock-btn em {
  position: absolute; top: 0; right: 10%;
  font-style: normal;
  font-size: 11px;
  background: var(--brass);
  color: var(--ink);
  border-radius: 99px;
  padding: 0 6px;
  min-width: 18px;
  text-align: center;
}
.dock-btn.off { opacity: .55; }

/* ── 모달 ─────────────────────────── */
.modal {
  position: fixed; inset: 0;
  z-index: 50;
  background: rgba(30, 28, 20, .55);
  display: flex; align-items: flex-end; justify-content: center;
  padding: 0 max(12px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
  animation: fadeIn .15s;
}
.modal-box {
  width: min(100%, 520px);
  max-height: 86%;
  overflow-y: auto;
  background: var(--paper);
  border: 3px solid var(--ink);
  border-radius: var(--r-lg);
  padding: 16px;
  box-shadow: 0 8px 0 var(--shadow);
  animation: sheetIn .25s cubic-bezier(.2, 1.2, .4, 1);
}
.modal-box h3 { margin: 0 0 4px; font-family: var(--font-display); font-weight: 400; font-size: 24px; color: var(--olive-dark); }
.modal-box .sub { margin: 0 0 12px; font-size: 14px; color: var(--muted); }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; }
.item-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.item {
  position: relative;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  border: 2px solid var(--ink);
  border-radius: var(--r-md);
  padding: 8px 4px 6px;
  background: #fffaf0;
  min-width: 0;
  text-align: center;
}
.item i { font-style: normal; font-size: 28px; line-height: 1.1; }
.item b { font-weight: 400; font-size: 14px; }
.item small { font-size: 11px; color: var(--muted); }
.item .count { position: absolute; top: 4px; right: 6px; font-size: 12px; font-family: var(--font-util); }
.item[aria-pressed="true"] { background: var(--olive); color: var(--cream); }
.item[aria-pressed="true"] small { color: var(--cream); }
.item:disabled { opacity: .45; }
.item-detail { margin-top: 12px; padding: 10px 12px; border: 2px dashed var(--olive); border-radius: var(--r-md); display: flex; flex-direction: column; gap: 8px; }
.item-detail p { margin: 0; }
.wallet { display: flex; justify-content: space-between; font-family: var(--font-util); font-size: 13px; background: rgba(86, 102, 47, .12); padding: 8px 10px; border-radius: var(--r-sm); margin-bottom: 10px; }
.stepper { display: flex; align-items: center; justify-content: center; gap: 16px; margin: 10px 0; }
.stepper button { width: 48px; height: 48px; border-radius: 50%; border: 3px solid var(--ink); background: var(--paper); font-size: 24px; box-shadow: 0 3px 0 var(--ink); }
.stepper output { font-family: var(--font-display); font-size: 44px; min-width: 2.2em; text-align: center; color: var(--olive-dark); font-variant-numeric: tabular-nums; }
.leave-info { font-size: 14px; color: var(--muted); text-align: center; margin: 0; }
.malchul { color: var(--stamp); font-size: 16px; text-align: center; margin: 6px 0 0; }
.toggle-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px dashed rgba(42, 38, 32, .25); }
.story { margin: 6px 0 0; padding: 0 0 0 18px; display: flex; flex-direction: column; gap: 4px; }
.promo-box { text-align: center; }
.promo-box .rank-big { width: 120px; margin: 6px auto 8px; animation: pop .5s cubic-bezier(.2, 1.6, .4, 1); }
.promo-box h3 { font-size: 34px; }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.confetti i { position: absolute; top: -12px; width: 9px; height: 14px; animation: fall 1.6s linear forwards; }

/* ── 토스트 ───────────────────────── */
.toast {
  position: fixed;
  left: 50%; top: calc(14px + env(safe-area-inset-top, 0px));
  transform: translateX(-50%);
  z-index: 70;
  background: var(--ink); color: var(--paper);
  padding: 8px 16px; border-radius: 99px;
  font-size: 15px;
  max-width: calc(100% - 32px);
  text-align: center;
  animation: toastIn .25s;
}

/* ── 엔딩 ─────────────────────────── */
.end-screen { overflow-y: auto; gap: 14px; padding-block: 16px; }
.cert {
  position: relative;
  background: var(--paper);
  border: 3px solid var(--ink);
  padding: 18px 16px;
  box-shadow: 6px 6px 0 var(--shadow);
  display: flex; flex-direction: column; gap: 10px;
  animation: noteIn .4s cubic-bezier(.2, 1.2, .4, 1);
}
.cert.good { border-color: #8a6a18; outline: 3px solid var(--brass); outline-offset: -10px; }
.cert-head { text-align: center; }
.cert-head small { letter-spacing: .3em; color: var(--muted); font-size: 12px; }
.cert-head h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 32px; letter-spacing: .1em; text-wrap: balance; }
.cert-art { position: relative; height: 200px; border: 2px solid var(--ink); border-radius: 6px; overflow: hidden; }
.cert-art .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
.cert-art .char { position: absolute; left: 50%; bottom: 0; width: 190px; height: 190px; transform: translateX(-50%); }
.ending-title { margin: 4px 0 0; text-align: center; font-family: var(--font-display); font-weight: 400; font-size: 26px; color: var(--olive-dark); text-wrap: balance; }
.cert.bad .ending-title { color: var(--stamp); }
.ending-text { margin: 0; font-size: 16px; text-wrap: pretty; }
.cert dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; font-size: 14px; border-top: 1px dashed rgba(42, 38, 32, .4); padding-top: 10px; }
.cert dt { color: var(--muted); }
.cert dd { margin: 0; font-family: var(--font-util); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
.cert .seal {
  position: absolute; right: 14px; top: 64px;
  width: 86px; height: 86px;
  border: 5px double var(--stamp);
  border-radius: 50%;
  display: grid; place-items: center;
  color: var(--stamp);
  font-family: var(--font-display);
  font-size: 22px;
  transform: rotate(-16deg);
  background: rgba(246, 240, 220, .6);
  animation: stamp .45s .35s cubic-bezier(.2, 1.6, .4, 1) both;
}
.cert .also { font-size: 13px; color: var(--olive); margin: 0; }
.log { margin: 0; padding-left: 16px; font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
.end-actions { display: flex; flex-direction: column; gap: 10px; width: min(100%, 340px); margin: 0 auto; }

/* ── 도감 ─────────────────────────── */
.album-screen { overflow-y: auto; gap: 12px; }
.album-head { display: flex; align-items: center; gap: 10px; }
.album-head h2 { flex: 1; margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 26px; }
.album-head span { font-family: var(--font-util); }
.album-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
.album-card {
  border: 2px solid var(--ink);
  border-radius: var(--r-md);
  background: var(--paper);
  overflow: hidden;
  display: flex; flex-direction: column;
  min-width: 0;
}
.album-card .thumb { position: relative; height: 96px; background: #c9d6dc; }
.album-card .thumb .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
.album-card .thumb .char { position: absolute; left: 50%; bottom: 0; width: 92px; height: 92px; transform: translateX(-50%); }
.album-card b { font-weight: 400; font-size: 13px; padding: 6px 6px 0; line-height: 1.25; }
.album-card small { font-size: 11px; color: var(--muted); padding: 0 6px 6px; line-height: 1.3; }
.album-card.good b { color: var(--olive-dark); }
.album-card.bad b { color: var(--stamp); }
.album-card.locked .thumb { background: var(--olive-dark); display: grid; place-items: center; color: var(--cream); font-family: var(--font-display); font-size: 34px; }
.album-stats { font-size: 13px; color: var(--muted); text-align: center; }

/* ── 미니게임 ─────────────────────── */
.mini {
  position: fixed; inset: 0; z-index: 40;
  background: var(--olive-dark);
  color: var(--cream);
  display: flex; flex-direction: column;
  padding: calc(10px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
.mg-head { flex: none; display: flex; flex-direction: column; gap: 2px; }
.mg-head h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 26px; color: var(--brass); }
.mg-head p { margin: 0; font-size: 14px; opacity: .85; }
.mg-hud { display: flex; justify-content: space-between; font-family: var(--font-util); font-size: 14px; margin-top: 6px; }
.mg-time { flex: none; height: 8px; background: rgba(0, 0, 0, .35); border-radius: 99px; overflow: hidden; margin-top: 6px; }
.mg-time i { display: block; height: 100%; width: 100%; background: var(--brass); }
.mg-stage { position: relative; flex: 1; min-height: 0; margin-top: 10px; border-radius: var(--r-lg); overflow: hidden; background: #1d2414; }
.mg-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.mg-count {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  font-family: var(--font-display);
  font-size: 96px;
  color: var(--brass);
  text-shadow: 0 6px 0 rgba(0, 0, 0, .4);
  pointer-events: none;
  z-index: 5;
}
.mg-count.pop { animation: pop .5s cubic-bezier(.2, 1.6, .4, 1); }
.mg-banner {
  position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -50%) rotate(-4deg);
  background: var(--paper); color: var(--ink);
  border: 3px solid var(--ink);
  border-radius: var(--r-md);
  padding: 14px 22px;
  font-family: var(--font-display);
  font-size: 30px;
  text-align: center;
  z-index: 6;
  animation: pop .45s cubic-bezier(.2, 1.6, .4, 1);
  width: max-content;
  max-width: 90%;
}
.mg-banner small { display: block; font-family: var(--font-body); font-size: 15px; margin-top: 4px; }
.gear-wrap { position: absolute; inset: 0; display: flex; flex-direction: column; }
.gear-order { flex: none; display: flex; gap: 6px; flex-wrap: wrap; padding: 10px; }
.gear-order span { font-size: 13px; padding: 3px 8px; border-radius: 99px; background: rgba(255, 255, 255, .1); }
.gear-order span.done { background: var(--good); text-decoration: line-through; }
.gear-order span.next { background: var(--brass); color: var(--ink); }
.gear-grid { flex: 1; min-height: 0; padding: 0 10px 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.gear {
  border: 3px solid var(--ink);
  border-radius: var(--r-md);
  background: var(--paper);
  color: var(--ink);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: 16px;
  touch-action: manipulation;
}
.gear i { font-style: normal; font-size: 34px; }
.gear.done { opacity: .25; }
.gear.wrong { animation: shake .3s; background: #ffd0c8; }
.memo-grid { position: absolute; inset: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.memo-face { background: #c9d6dc; border-radius: var(--r-md); overflow: hidden; position: relative; display: flex; flex-direction: column; }
.memo-face .char { flex: 1; min-height: 0; width: 100%; }
.memo-face b { font-weight: 400; background: var(--paper); color: var(--ink); text-align: center; padding: 2px; font-size: 15px; }
.memo-quiz { position: absolute; inset: 10px; display: flex; flex-direction: column; gap: 10px; }
.memo-quiz .face { flex: 1; min-height: 0; background: #c9d6dc; border-radius: var(--r-md); overflow: hidden; }
.memo-quiz .face .char { width: 100%; height: 100%; }
.memo-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.memo-opts button { border: 3px solid var(--ink); border-radius: var(--r-md); background: var(--paper); color: var(--ink); padding: 12px 6px; font-size: 16px; }
.memo-opts button.ok { background: #bfe6b8; }
.memo-opts button.no { background: #ffc9bf; }

/* ── 애니메이션 ───────────────────── */
.char .bob { animation: bob 2.4s ease-in-out infinite; transform-origin: 50% 100%; transform-box: fill-box; }
.char .eyes { animation: blink 4.2s infinite; transform-origin: center; transform-box: fill-box; }
.char .snot { animation: snot 2.2s ease-in-out infinite; transform-origin: 30% 30%; transform-box: fill-box; }
.char .drool { animation: drool 2.6s ease-in-out infinite; transform-origin: top; transform-box: fill-box; }
.char .sweat { animation: drip 1.8s ease-in infinite; }
.char .zzz { animation: zzz 2.4s ease-in-out infinite; }
.char .wave { animation: wave .7s ease-in-out infinite alternate; }
.char .shake { animation: wiggle .5s ease-in-out infinite alternate; transform-origin: 50% 100%; transform-box: fill-box; }
.char .tail { animation: tail 1.4s ease-in-out infinite alternate; transform-origin: 0% 100%; transform-box: fill-box; }
.char .spark { animation: twinkle 1.2s ease-in-out infinite alternate; }
.scene .flake { animation: flake 3s linear infinite; }
.scene .leaf { animation: flake 4s linear infinite; }

@keyframes bob { 0%, 100% { transform: translateY(0) scaleY(1); } 50% { transform: translateY(-3px) scaleY(1.015); } }
@keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.08); } }
@keyframes snot { 0%, 100% { transform: scale(.35); } 60% { transform: scale(1.15); } 70% { transform: scale(1); } }
@keyframes drool { 0%, 100% { transform: scaleY(.6); } 50% { transform: scaleY(1.2); } }
@keyframes drip { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(26px); opacity: 0; } }
@keyframes zzz { 0%, 100% { transform: translate(0, 0); opacity: .6; } 50% { transform: translate(4px, -6px); opacity: 1; } }
@keyframes wave { from { opacity: .3; } to { opacity: 1; } }
@keyframes wiggle { from { transform: rotate(-2deg); } to { transform: rotate(2deg); } }
@keyframes tail { from { transform: rotate(-6deg); } to { transform: rotate(8deg); } }
@keyframes twinkle { from { opacity: .3; } to { opacity: 1; } }
@keyframes flake { from { transform: translateY(-20px); } to { transform: translateY(40px); } }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
@keyframes floatUp { 0% { transform: translateY(6px); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-26px); opacity: 0; } }
@keyframes cardIn { from { transform: translateY(40px) scale(.9) rotate(4deg); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes noteIn { from { transform: translateY(24px) rotate(3deg) scale(.9); opacity: 0; } to { transform: rotate(-1.2deg); opacity: 1; } }
@keyframes sheetIn { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes toastIn { from { transform: translate(-50%, -16px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
@keyframes pop { 0% { transform: scale(.3); } 100% { transform: scale(1); } }
@keyframes stamp { 0% { transform: rotate(-16deg) scale(2.4); opacity: 0; } 100% { transform: rotate(-16deg) scale(1); opacity: 1; } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
@keyframes blinkText { 50% { opacity: .3; } }
.tap-next { animation-name: blinkText; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* 아주 작은 화면(높이) 대응 */
@media (max-height: 640px) {
  .prompt { font-size: 15px; min-height: 4em; padding: 7px 10px; }
  .stat-ic { width: 32px; height: 30px; }
  .hud-dday b { font-size: 22px; }
  .dock-btn i { font-size: 19px; }
  .choice { min-height: 42px; font-size: 14px; }
}
/* 넓은 화면: 가운데 정렬된 폰 비율 */
@media (min-width: 700px) {
  body { display: flex; justify-content: center; }
  #app { width: 480px; }
}

<body>
<div id="app">

  <!-- 타이틀 -->
  <section id="scr-title" class="screen title-screen">
    <div class="title-top">
      <p class="eyebrow">대한민국 육군 · 복무기간 18개월</p>
      <h1 class="logo">전역<span>각</span></h1>

    </div>
    <div class="title-crowd" id="title-crowd" aria-hidden="true"></div>
    <div class="title-actions">
      <button class="btn btn-primary" id="btn-continue" hidden>이어하기</button>
      <p class="save-info" id="save-info" hidden></p>
      <button class="btn btn-primary" id="btn-new">입대하기</button>
      <button class="btn btn-ghost" id="btn-album">엔딩 도감 <span id="album-count">0/19</span></button>
    </div>
    <p class="fine">좌우로 넘겨서 선택 · 체력·멘탈·간부 신뢰·전우애 중 하나라도 0이나 100이 되면 전역 실패</p>
  </section>

  <!-- 입영 통지서 (게임 설정) -->
  <section id="scr-setup" class="screen setup-screen" hidden>
    <form class="notice" id="setup-form" autocomplete="off">
      <header class="notice-head">
        <span class="notice-org">전역각 입영센터</span>
        <h2>현역병 입영 통지서</h2>
        <span class="notice-no" id="notice-no">제 2026-000000 호</span>
      </header>

      <div class="notice-face">
        <div class="face-preview" id="face-preview"></div>
        <button type="button" class="btn btn-small" id="btn-face">얼굴 다시 뽑기 🎲</button>
      </div>

      <label class="field">
        <span>성명</span>
        <input id="in-name" name="name" maxlength="6" placeholder="나띨빵" required>
      </label>
      <label class="field">
        <span>입영일자</span>
        <input id="in-date" name="start" type="date" required>
      </label>
      <p class="field-note" id="date-note">전역 예정일: -</p>

      <fieldset class="field">
        <legend>보직 (주특기)</legend>
        <div class="mos-grid" id="mos-grid"></div>
      </fieldset>

      <fieldset class="field">
        <legend>복무 방식</legend>
        <div class="pace-grid">
          <label class="pace"><input type="radio" name="pace" value="1" checked><span><b>정상 복무</b><small>카드 약 120장 · 30분 내외</small></span></label>
          <label class="pace"><input type="radio" name="pace" value="3"><span><b>속성 복무</b><small>카드 약 45장 · 10분 내외</small></span></label>
        </div>
      </fieldset>

      <div class="notice-actions">
        <button type="button" class="btn btn-ghost" id="btn-setup-back">취소</button>
        <button type="submit" class="btn btn-primary">입영하기</button>
      </div>
      <div class="stamp" aria-hidden="true">입영<br>승인</div>
    </form>
  </section>

  <!-- 게임 -->
  <section id="scr-game" class="screen game-screen" hidden>
    <header class="hud">
      <div class="hud-row">
        <div class="hud-rank" id="hud-rank"></div>
        <div class="hud-name"><b id="hud-name">이병 나띨빵</b><small id="hud-date">2026.03.02 · 봄</small></div>
        <div class="hud-dday"><small>전역까지</small><b id="hud-dday">D-547</b></div>
      </div>
      <div class="gauge" aria-label="복무율">
        <div class="gauge-bar"><i id="gauge-fill"></i></div>
        <span id="gauge-pct">0.0%</span>
      </div>
      <div class="stats" id="stats"></div>
    </header>

    <main class="stage">
      <div class="prompt" id="prompt" aria-live="polite"></div>
      <div class="card-zone" id="card-zone">
        <div class="card" id="card" tabindex="0" aria-label="이벤트 카드 — 좌우로 넘겨 선택"></div>
        <div class="result" id="result" hidden></div>
      </div>
      <div class="choices" id="choices">
        <button class="choice" data-side="l"><span>◀</span><b id="choice-l"></b></button>
        <button class="choice" data-side="r"><b id="choice-r"></b><span>▶</span></button>
      </div>
    </main>

    <nav class="dock">
      <button class="dock-btn" id="dock-bag"><i>🎒</i><span>가방</span><em id="bag-badge">0</em></button>
      <button class="dock-btn" id="dock-px"><i>🏪</i><span>PX</span><em id="px-badge" hidden>!</em></button>
      <button class="dock-btn" id="dock-leave"><i>🏖️</i><span>휴가</span><em id="leave-badge">0일</em></button>
      <button class="dock-btn" id="dock-menu"><i>⚙️</i><span>메뉴</span></button>
    </nav>
  </section>

  <!-- 엔딩 -->
  <section id="scr-end" class="screen end-screen" hidden>
    <div class="cert" id="cert"></div>
    <div class="end-actions">
      <button class="btn btn-primary" id="btn-reenlist">재입대하기 (악몽)</button>
      <button class="btn btn-ghost" id="btn-end-album">엔딩 도감</button>
      <button class="btn btn-ghost" id="btn-end-title">타이틀로</button>
    </div>
  </section>

  <!-- 엔딩 도감 -->
  <section id="scr-album" class="screen album-screen" hidden>
    <header class="album-head">
      <button class="btn btn-small" id="btn-album-back">← 뒤로</button>
      <h2>엔딩 도감</h2>
      <span id="album-progress">0/19</span>
    </header>
    <div class="album-grid" id="album-grid"></div>
    <p class="album-stats" id="album-stats"></p>
  </section>
</div>

<div id="modal" class="modal" hidden>
  <div class="modal-box" id="modal-box" role="dialog" aria-modal="true"></div>
</div>
<div id="mini" class="mini" hidden></div>
<div id="toast" class="toast" hidden></div>
<script>
/* js/art.js */

 */
(function (JY) {

      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;

  var INK = '#2a2620';

  function camoPattern(id, seed, colors) {

  function drawBrows(type) {

  function drawMouth(type) {

        return '<ellipse cx="98" cy="137" rx="10" ry="8" fill="#5c2020" ' + st + '/>' +
          '<path class="drool" d="M106 141 Q108 152 106 160 Q110 166 113 160 Q111 150 110 140Z" fill="#bfe6ff" stroke="#7fb8dc" stroke-width="1.5"/>';

        return '<path d="M82 132 Q100 142 118 132" fill="none" ' + st + '/><rect x="93" y="134" width="7" height="10" rx="1.5" fill="#fff" stroke="' + INK + '" stroke-width="2"/><rect x="100" y="134" width="7" height="10" rx="1.5" fill="#fff" stroke="' + INK + '" stroke-width="2"/>';
      case 'wavy':
        return '<path d="M82 138 L88 133 L94 139 L100 133 L106 139 L112 133 L118 138" fill="none" ' + st + '/>';
      case 'flat':
        return '<path d="M86 138 L114 138" ' + st + '/>';
      case 'shout':
        return '<path d="M80 128 Q100 124 120 128 Q122 158 100 160 Q78 158 80 128Z" fill="#5c2020" ' + st + '/><path d="M88 150 Q100 142 112 150 Q106 158 100 158 Q94 158 88 150Z" fill="#e5767a"/><path d="M84 130 L116 130 L114 135 L86 135Z" fill="#fff"/>';

  /* ── 캐릭터 조립 ───────────────────────────────────── */
  function character(spec, opts) {
    spec = spec || {};
    opts = opts || {};
    var id = uid();
    var seed = hash(spec.seed || spec.name || id);
    var skin = spec.skin || SKINS[seed % SKINS.length];
    var camoId = id + 'c';
    var clipId = id + 'h';
    var eyes = opts.eyes || spec.eyes || 'normal';
    var mouth = opts.mouth || spec.mouth || 'smile';
    var extras = (spec.extras || []).concat(opts.extras || []);
    var hat = spec.hat === undefined ? 'none' : spec.hat;
    var hair = spec.hair || (hat === 'none' || hat === 'chef' ? 'buzz' : 'none');
    var big = extras.indexOf('bigEars') >= 0;
    var shape = spec.head || 'round';
    var earX = shape === 'wide' ? 30 : shape === 'egg' ? 44 : 38;

    var defs = '<defs>' + camoPattern(camoId, seed) +
      '<clipPath id="' + clipId + '">' + headPath(shape) + '</clipPath>' +
      '<clipPath id="' + camoId + 'b"><path d="M30 232 Q32 176 100 168 Q168 176 170 232 Z"/></clipPath></defs>';

    var svg = '<svg class="char" viewBox="0 0 200 232" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' + defs +
      '<ellipse cx="100" cy="228" rx="70" ry="8" fill="rgba(0,0,0,.12)"/>' +
      '<g class="bob">' +
      drawBody(spec.body || 'camo', camoId, spec.rank, spec.tag) +
      '<g class="head">' +
      drawHairBack(hair) +
      '<circle cx="' + (200 - earX) + '" cy="106" r="' + (big ? 20 : 13) + '" fill="' + skin + '" stroke="' + INK + '" stroke-width="3"/>' +
      '<circle cx="' + earX + '" cy="106" r="' + (big ? 20 : 13) + '" fill="' + skin + '" stroke="' + INK + '" stroke-width="3"/>' +
      headPath(shape).replace('/>', ' fill="' + skin + '" stroke="' + INK + '" stroke-width="3.5"/>') +
      drawHairFront(hair, clipId) +
      drawBrows(spec.brows) +
      drawEyes(eyes, skin) +
      drawNose(spec.nose) +
      drawMouth(mouth) +
      drawExtras(extras, skin) +
      drawHat(hat, camoId, spec.hatRank, spec.hatDy) +
      '</g>' +
      drawProp(spec.prop).replace(/\{skin\}/g, skin) +
      '</g></svg>';
    return svg;

  }

  function showPreview(side) {
    var dots = document.querySelectorAll('.stat .dot');
    dots.forEach(function (d) { d.classList.remove('on', 'big'); });
    if (!side || !state) return;
    var c = G.currentCard(state);
    var p = c[side].preview;
    G.STATS.forEach(function (k) {
      if (!p[k]) return;
      var d = document.querySelector('.stat[data-k="' + k + '"] .dot');
      d.classList.add('on'); if (p[k] === 'big') d.classList.add('big');
    });
  }

  function animateDeltas(deltas) {
    for (var k in deltas) {
      var v = deltas[k];
      if (!v) continue;
      var el = document.querySelector('.stat[data-k="' + k + '"]');
      if (!el) continue;
      var d = document.createElement('span');
      d.className = 'delta ' + (v > 0 ? 'up' : 'down');
      d.textContent = (v > 0 ? '+' : '') + v;
      el.appendChild(d);
      setTimeout(function (n) { return function () { n.remove(); }; }(d), 1150);
    }
  }

  /* ── 카드 ───────────────────────────── */
  function fitCard() {
    var zone = $('#card-zone'), card = $('#card');
    if (!zone || !card) return;
    var r = zone.getBoundingClientRect();
    if (!r.width || !r.height) return;
    var ratio = 0.82;
    var w = Math.min(r.width, r.height * ratio, 400);
    var h = w / ratio;
    if (h > r.height) { h = r.height; w = h * ratio; }
    card.style.width = Math.floor(w) + 'px';
    card.style.height = Math.floor(h) + 'px';
  }

  function renderCard(enter) {
    if (!state || state.over) return;
    var c = G.currentCard(state);
    var nm = charName(c.who);
    $('#prompt').innerHTML = '<span class="who">' + esc(nm.name) + '</span><br>' + esc(c.text);
    var card = $('#card');
    card.className = 'card';
    card.style.transform = '';
    card.style.opacity = '';
    card.innerHTML = A.scene(c.bg || 'barracks', state.season) +
      '<div class="char-wrap">' + charSVG(c.who, c) + '</div>' +
      '<div class="card-label l' + (c.l.preview.mini ? ' mini' : '') + '">' + esc(c.l.t) + '</div>' +
      '<div class="card-label r' + (c.r.preview.mini ? ' mini' : '') + '">' + esc(c.r.t) + '</div>' +
      '<div class="nametape"><b>' + esc(nm.name) + '</b><span>' + esc(nm.role) + '</span></div>';
    $('#choice-l').textContent = c.l.t;
    $('#choice-r').textContent = c.r.t;
    document.querySelectorAll('.choice').forEach(function (b) { b.classList.remove('armed'); b.disabled = false; });
    armed = null;
    showPreview(null);
    if (enter) { void card.offsetWidth; card.classList.add('enter'); }
    fitCard();
  }

  function setCardPose(dx, dy) {
    var card = $('#card');
    card.style.transform = 'translate(' + dx + 'px,' + (dy || 0) + 'px) rotate(' + (dx * 0.06) + 'deg)';
    var side = dx < -14 ? 'l' : dx > 14 ? 'r' : null;
    var amt = Math.min(1, Math.abs(dx) / 70);
    card.querySelector('.card-label.l').style.opacity = side === 'l' ? amt : 0;
    card.querySelector('.card-label.r').style.opacity = side === 'r' ? amt : 0;
    return side;
  }

  function arm(side) {
    if (busy || !state || state.over) return;
    if (armed === side) { commit(side); return; }
    armed = side;
    document.querySelectorAll('.choice').forEach(function (b) { b.classList.toggle('armed', b.dataset.side === side); });
    var card = $('#card');
    card.classList.remove('enter'); card.classList.add('back');
    setCardPose(side === 'l' ? -46 : 46, 0);
    showPreview(side);
    snd('tap');
    toast('한 번 더 누르면 결정!', 1200);
  }

  function disarm() {
    armed = null;
    document.querySelectorAll('.choice').forEach(function (b) { b.classList.remove('armed'); });
  }

  function bindSwipe() {
    var card = $('#card');
    card.addEventListener('pointerdown', function (e) {
      if (busy || !state || state.over || drag) return;
      if (e.button !== undefined && e.button !== 0) return;
      if (JY.Sound) JY.Sound.unlock();
      drag = { id: e.pointerId, x0: e.clientX, y0: e.clientY, dx: 0, side: null };
      card.classList.remove('back', 'enter');
      disarm();
      try { card.setPointerCapture(e.pointerId); } catch (x) { /* 무시 */ }
    });
    card.addEventListener('pointermove', function (e) {
      if (!drag || e.pointerId !== drag.id) return;
      drag.dx = e.clientX - drag.x0;
      var side = setCardPose(drag.dx, (e.clientY - drag.y0) * 0.15);
      if (side !== drag.side) { drag.side = side; showPreview(side); }
    });
    function endDrag(e, cancel) {
      if (!drag || (e && e.pointerId !== drag.id)) return;
      var d = drag; drag = null;
      var th = Math.min(110, card.offsetWidth * 0.3);
      if (!cancel && Math.abs(d.dx) > th) { commit(d.dx < 0 ? 'l' : 'r'); return; }
      card.classList.add('back');
      setCardPose(0, 0);
      showPreview(null);
    }
    card.addEventListener('pointerup', function (e) { endDrag(e, false); });
    card.addEventListener('pointercancel', function (e) { endDrag(e, true); });
    card.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowLeft') { e.preventDefault(); arm('l'); }
      if (e.key === 'ArrowRight') { e.preventDefault(); arm('r'); }
    });
    document.querySelectorAll('.choice').forEach(function (b) {
      b.addEventListener('click', function () { arm(b.dataset.side); });
    });
    document.addEventListener('keydown', function (e) {
      if ($('#scr-game').hidden || !$('#modal').hidden || !$('#mini').hidden) return;
      if (!$('#result').hidden && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); $('#result').click(); return; }
      if (document.activeElement === card) return;
      if (e.key === 'ArrowLeft') arm('l');
      if (e.key === 'ArrowRight') arm('r');
    });
  }

  function commit(side) {
    if (busy || !state || state.over) return;
    busy = true;
    disarm();
    showPreview(null);
    snd('swipe');
    if (JY.buzz) JY.buzz(8);
    var card = $('#card');
    var w = window.innerWidth;
    card.classList.remove('back', 'enter');
    card.classList.add('fly');
    card.style.transform = 'translate(' + (side === 'l' ? -1.2 * w : 1.2 * w) + 'px, 60px) rotate(' + (side === 'l' ? -28 : 28) + 'deg)';
    card.style.opacity = '0';
    var res = G.choose(state, side);
    save();
    setTimeout(function () {
      if (!res) { busy = false; renderCard(true); return; }
      if (res.mini) runMini(res);
      else afterChoice(res);
    }, 280);
  }

  function runMini(res) {
    JY.Mini.start(res.mini, { stats: state.stats, mos: state.mos, face: function (w) { return charSVG(w); } }, function (tier) {
      var r2 = G.finishMini(state, tier);
      save();
      if (!r2) { busy = false; renderCard(true); return; }
      var merged = {
        say: [res.say, r2.say].filter(Boolean).join(' '),
        deltas: {}, events: (res.events || []).concat(r2.events || []), ending: r2.ending || res.ending
      };
      [res.deltas, r2.deltas].forEach(function (d) { for (var k in d) merged.deltas[k] = (merged.deltas[k] || 0) + d[k]; });
      afterChoice(merged);
    });
  }

  function afterChoice(res) {
    renderHUD();
    animateDeltas(res.deltas || {});
    var sum = 0, any = false;
    for (var k in res.deltas) { if (res.deltas[k]) any = true; sum += res.deltas[k]; }
    if (res.ending && !(JY.ENDINGS[res.ending] && JY.ENDINGS[res.ending].good)) snd('bad');
    else if (any) snd(sum >= 0 ? 'good' : 'bad');
    var has = res.say || any || (res.events && res.events.length);
    if (!has) { nextAfterResult(res); return; }
    showResult(res, function () { nextAfterResult(res); });
  }

  function eventLine(e) {
    switch (e.type) {
      case 'pay': return '💰 월급날! ' + won(e.n) + ' (적금 ' + won(e.save) + ' 자동 납입)';
      case 'promo': return '🎖️ ' + e.text;
      case 'promoFail': return '📉 ' + e.text;
      case 'season': return '🗓️ ' + e.text;
      case 'leave': return '🏖️ ' + e.text;
      case 'item': return '🎁 ' + (JY.ITEMS[e.id] ? JY.ITEMS[e.id].name : e.id) + ' ' + (e.n > 0 ? '+' : '') + e.n;
      case 'money': return (e.n > 0 ? '💰 ' : '💸 ') + (e.n > 0 ? '+' : '') + won(e.n);
      case 'save': return '🏦 적금 +' + won(e.n);
      case 'block': return '⛔ 휴가 통제 ' + e.n + '일';
      default: return e.text || '';
    }
  }

  function showResult(res, cb) {
    var box = $('#result');
    var chips = '';
    G.STATS.forEach(function (k) {
      var v = res.deltas && res.deltas[k];
      if (!v) return;
      chips += '<span class="chip ' + (v > 0 ? 'up' : 'down') + '">' + ICON[k] + ' ' + (v > 0 ? '+' : '') + v + '</span>';
    });
    var evs = (res.events || []).map(function (e) { return '<div>' + esc(eventLine(e)) + '</div>'; }).join('');
    box.innerHTML = '<div class="note">' +
      (res.say ? '<p>' + esc(res.say) + '</p>' : '') +
      (chips ? '<div class="chips">' + chips + '</div>' : '') +
      (evs ? '<div class="events">' + evs + '</div>' : '') +
      '<span class="tap-next">탭해서 계속 ▶</span></div>';
    box.hidden = false;
    var shownAt = Date.now();
    box.onclick = function () {
      if (Date.now() - shownAt < 350) return;
      box.onclick = null;
      box.hidden = true;
      cb();
    };
  }

  function nextAfterResult(res) {
    var promos = (res.events || []).filter(function (e) { return e.type === 'promo'; });
    function go() {
      if (state.over) { showEnding(); return; }
      if (state.pendingMini) { runMini({ mini: state.pendingMini.id, say: '', deltas: {}, events: [] }); return; }
      renderHUD();
      renderCard(true);
      busy = false;
    }
    if (promos.length) showPromo(promos[promos.length - 1], go);
    else go();
  }

  /* ── 모달 ───────────────────────────── */
  var modalClose = null;
  function openModal(html, bind, onClose) {
    var m = $('#modal'), box = $('#modal-box');
    box.innerHTML = html;
    m.hidden = false;
    modalClose = onClose || null;
    if (bind) bind(box);
  }
  function closeModal() {
    var m = $('#modal');
    if (m.hidden) return;
    m.hidden = true;
    $('#modal-box').innerHTML = '';
    var f = modalClose; modalClose = null;
    if (f) f();
  }

  function confetti() {
    var c = document.createElement('div');
    c.className = 'confetti';
    var cols = ['#e0b347', '#56662f', '#c4362b', '#f6f0dc', '#8fc6ea'];
    for (var i = 0; i < 40; i++) {
      var p = document.createElement('i');
      p.style.left = (Math.random() * 100) + '%';
      p.style.background = cols[i % cols.length];
      p.style.animationDelay = (Math.random() * 0.5) + 's';
      p.style.animationDuration = (1.2 + Math.random() * 0.9) + 's';
      c.appendChild(p);
    }
    document.body.appendChild(c);
    setTimeout(function () { c.remove(); }, 2600);
  }

  function showPromo(e, cb) {
    snd('promo');
    confetti();
    if (JY.buzz) JY.buzz([30, 40, 30]);
    openModal('<div class="promo-box"><div class="rank-big">' + A.rankInsignia(e.rank) + '</div>' +
      '<h3>' + G.RANKS[e.rank] + ' 진급!</h3><p class="sub">' + PROMO_TEXT[e.rank] + '</p>' +
      (e.leave ? '<p>🏖️ 휴가 +' + e.leave + '일 지급</p>' : '') +
      '<p class="sub">월급: ' + won(G.PAY[e.rank]) + '</p>' +
      '<div class="modal-actions"><button class="btn btn-primary" data-act="ok">충성!</button></div></div>',
    function (box) { box.querySelector('[data-act="ok"]').onclick = closeModal; }, cb);
  }

  function fxChips(fx) {
    return Object.keys(fx).map(function (k) {
      var v = fx[k];
      return '<span class="chip ' + (v > 0 ? 'up' : 'down') + '">' + ICON[k] + ' ' + (v > 0 ? '+' : '') + v + '</span>';
    }).join('');
  }

  function openBag() {
    if (!state || busy) return;
    var sel = null;
    function html() {
      var ids = JY.ITEM_ORDER.filter(function (id) { return state.items[id] > 0; });
      var grid = ids.length ? '<div class="item-grid">' + ids.map(function (id) {
        var it = JY.ITEMS[id];
        return '<button class="item" data-id="' + id + '" aria-pressed="' + (sel === id) + '"><span class="count">×' + state.items[id] + '</span><i>' + it.icon + '</i><b>' + it.name + '</b></button>';
      }).join('') + '</div>' : '<p class="sub">가방이 비었다. PX에서 사 오자.</p>';
      var detail = '';
      if (sel && state.items[sel] > 0) {
        var it = JY.ITEMS[sel];
        detail = '<div class="item-detail"><p><b>' + it.icon + ' ' + it.name + '</b> — ' + it.desc + '</p><div class="chips">' + fxChips(it.fx) + '</div>' +
          '<button class="btn btn-primary btn-small" data-act="use">사용하기</button></div>';
      }
      return '<h3>가방</h3><p class="sub">아이템은 스탯을 5~95 사이에서만 움직인다. 위험할 때 쓰자.</p>' + grid + detail +
        '<div class="modal-actions"><button class="btn btn-ghost" data-act="close">닫기</button></div>';
    }
    function bind(box) {
      box.querySelectorAll('.item').forEach(function (b) { b.onclick = function () { sel = b.dataset.id; snd('tap'); box.innerHTML = html(); bind(box); }; });
      var u = box.querySelector('[data-act="use"]');
      if (u) u.onclick = function () {
        var r = G.useItem(state, sel);
        if (r) {
          save(); renderHUD(); animateDeltas(r.deltas);
          var moved = Object.keys(r.deltas).some(function (k) { return r.deltas[k]; });
          snd(moved ? 'good' : 'tap');
          toast(moved ? JY.ITEMS[sel].name + ' 사용!' : '이미 충분하다. 효과가 없었다.');
        }
        if (!(state.items[sel] > 0)) sel = null;
        box.innerHTML = html(); bind(box);
      };
      box.querySelector('[data-act="close"]').onclick = closeModal;
    }
    openModal(html(), bind);
  }

  function openPX() {
    if (!state || busy) return;
    var st = G.pxStatus(state);
    if (!st.ok) { toast(st.reason); return; }
    var bought = false;
    function html() {
      var list = JY.ITEM_ORDER.filter(function (id) { return JY.ITEMS[id].px !== false; });
      return '<h3>PX</h3><p class="sub">한 번 다녀오면 며칠 뒤에 다시 갈 수 있다.</p>' +
        '<div class="wallet"><span>현금 ' + won(state.money) + '</span><span>적금 ' + won(state.savings) + '</span></div>' +
        '<div class="item-grid">' + list.map(function (id) {
          var it = JY.ITEMS[id];
          var cant = state.money < it.price || (state.items[id] || 0) >= 9;
          return '<button class="item" data-id="' + id + '"' + (cant ? ' disabled' : '') + '><span class="count">×' + (state.items[id] || 0) + '</span><i>' + it.icon + '</i><b>' + it.name + '</b><small>' + won(it.price) + '</small><small>' + Object.keys(it.fx).map(function (k) { return SHORT[k] + (it.fx[k] > 0 ? '+' : '') + it.fx[k]; }).join(' ') + '</small></button>';
        }).join('') + '</div>' +
        '<div class="modal-actions"><button class="btn btn-primary" data-act="close">계산 끝, 나가기</button></div>';
    }
    function bind(box) {
      box.querySelectorAll('.item').forEach(function (b) {
        b.onclick = function () {
          if (G.buy(state, b.dataset.id)) { bought = true; snd('coin'); save(); renderHUD(); box.innerHTML = html(); bind(box); }
          else toast('돈이 부족하거나 가방이 꽉 찼다.');
        };
      });
      box.querySelector('[data-act="close"]').onclick = closeModal;
    }
    openModal(html(), bind, function () { G.closePX(state, bought); save(); renderHUD(); });
  }

  function openLeave() {
    if (!state || busy) return;
    var st = G.leaveStatus(state);
    var np = G.nextPromo(state);
    var head = '<h3>휴가 신청</h3><p class="sub">남은 휴가 ' + state.leave + '일 · 사용 ' + state.leaveUsed + '일' + (np ? ' · 다음 진급 ' + np.rank + ' (' + np.date + ')' : '') + '</p>';
    if (!st.ok) {
      openModal(head + '<p>' + esc(st.reason) + '</p><p class="sub">휴가는 진급할 때마다 지급되고, 특급전사·특등사수·대회 우승으로 포상휴가를 받을 수 있다. 남은 휴가가 전역까지 남은 날짜보다 많으면 말출(말년휴가) 후 그대로 전역!</p>' +
        '<div class="modal-actions"><button class="btn btn-ghost" data-act="close">닫기</button></div>',
      function (box) { box.querySelector('[data-act="close"]').onclick = closeModal; });
      return;
    }
    var n = Math.min(st.max, Math.max(1, Math.min(5, st.max)));
    function body() {
      var leaveEnd = G.dateOf(state, Math.min(state.total, state.day + n));
      var mal = n >= st.malchulAt;
      return head +
        '<div class="stepper"><button data-act="minus" aria-label="하루 줄이기">−</button><output id="leave-n">' + n + '일</output><button data-act="plus" aria-label="하루 늘리기">+</button></div>' +
        '<p class="leave-info">' + G.dateOf(state) + ' 출발 → ' + leaveEnd + (mal ? ' 전역' : ' 복귀') + '</p>' +
        (mal ? '<p class="malchul">🎉 말년휴가! 복귀 없이 그대로 전역한다!</p>' : '<p class="leave-info">휴가 중에는 멘탈·체력이 회복된다. 복귀 후 ' + 20 + '일은 다시 못 나간다.</p>') +
        '<div class="modal-actions"><button class="btn btn-ghost" data-act="close">취소</button><button class="btn btn-primary" data-act="go">' + (mal ? '말출 나가기' : '휴가 출발') + '</button></div>';
    }
    function bind(box) {
      box.querySelector('[data-act="minus"]').onclick = function () { n = Math.max(1, n - 1); snd('tick'); box.innerHTML = body(); bind(box); };
      box.querySelector('[data-act="plus"]').onclick = function () { n = Math.min(st.max, n + 1); snd('tick'); box.innerHTML = body(); bind(box); };
      box.querySelector('[data-act="close"]').onclick = closeModal;
      box.querySelector('[data-act="go"]').onclick = function () {
        var res = G.takeLeave(state, n);
        closeModal();
        if (!res) return;
        save();
        renderHUD();
        animateDeltas(res.deltas);
        showLeaveStory(res);
      };
    }
    openModal(body(), bind);
  }

  function showLeaveStory(res) {
    snd('win');
    var lines = (res.story || ['부대 밖 공기는 달았다.']).map(function (l) { return '<li>' + esc(l) + '</li>'; }).join('');
    var evs = (res.events || []).map(function (e) { return '<li>' + esc(eventLine(e)) + '</li>'; }).join('');
    var malchul = state.over;
    openModal('<h3>' + (malchul ? '말년휴가 출발!' : '휴가 일기') + '</h3>' +
      (malchul ? '<p>부대 정문을 나선다. 다시 돌아올 일은… 짐 가지러 올 때뿐이다.</p>' : '<p class="sub">' + G.dateOf(state) + ' 복귀</p><ul class="story">' + lines + '</ul>') +
      (evs ? '<ul class="story">' + evs + '</ul>' : '') +
      '<div class="modal-actions"><button class="btn btn-primary" data-act="ok">' + (malchul ? '전역 신고하러 가기' : '부대 복귀…') + '</button></div>',
    function (box) { box.querySelector('[data-act="ok"]').onclick = closeModal; },
    function () {
      var promos = (res.events || []).filter(function (e) { return e.type === 'promo'; });
      function go() { if (state.over) showEnding(); else { renderHUD(); renderCard(true); } }
      if (promos.length && !state.over) showPromo(promos[promos.length - 1], go); else go();
    });
  }

  function openMenu() {
    if (!state) return;
    var np = G.nextPromo(state);
    var confirmReset = false;
    function html() {
      return '<h3>메뉴</h3>' +
        '<div class="wallet"><span>현금 ' + won(state.money) + '</span><span>적금 ' + won(state.savings) + '</span></div>' +
        '<p class="sub">입대 ' + G.dateOf(state, 0) + ' · 전역 ' + G.fmtDate(state.end) + (np ? ' · 다음 진급 ' + np.rank + ' ' + np.date : '') + '</p>' +
        '<div class="toggle-row"><span>효과음</span><button class="btn btn-small" data-act="sound">' + (settings.sound ? '켜짐' : '꺼짐') + '</button></div>' +
        '<div class="toggle-row"><span>진동</span><button class="btn btn-small" data-act="vibe">' + (settings.vibe ? '켜짐' : '꺼짐') + '</button></div>' +
        '<div class="toggle-row"><span>게임 방법</span><button class="btn btn-small" data-act="help">보기</button></div>' +
        '<div class="modal-actions">' +
        '<button class="btn btn-ghost" data-act="reset">' + (confirmReset ? '정말? 한 번 더 누르면 기록 삭제' : '처음부터 다시 입대') + '</button>' +
        '<button class="btn btn-ghost" data-act="title">타이틀로 (자동 저장)</button>' +
        '<button class="btn btn-primary" data-act="close">계속하기</button></div>';
    }
    function bind(box) {
      box.querySelector('[data-act="sound"]').onclick = function () { settings.sound = !settings.sound; applySettings(); box.innerHTML = html(); bind(box); };
      box.querySelector('[data-act="vibe"]').onclick = function () { settings.vibe = !settings.vibe; applySettings(); box.innerHTML = html(); bind(box); };
      box.querySelector('[data-act="help"]').onclick = function () { closeModal(); openHelp(); };
      box.querySelector('[data-act="reset"]').onclick = function () {
        if (!confirmReset) { confirmReset = true; box.innerHTML = html(); bind(box); return; }
        lsDel(KEYS.save); state = null; closeModal(); renderSetup();
      };
      box.querySelector('[data-act="title"]').onclick = function () { save(); closeModal(); renderTitle(); };
      box.querySelector('[data-act="close"]').onclick = closeModal;
    }
    openModal(html(), bind);
  }

  function openHelp() {
    openModal('<h3>게임 방법</h3>' +
      '<ul class="story">' +
      '<li>카드를 왼쪽·오른쪽으로 넘기거나 아래 버튼을 두 번 눌러 선택한다.</li>' +
      '<li>카드를 끌면 위쪽 스탯에 점이 뜬다. 점이 클수록 크게 변한다(오를지 내릴지는 비밀).</li>' +
      '<li>체력·멘탈·간부 신뢰·전우애 중 하나라도 0이나 100이 되면 전역 실패. 너무 잘해도 말뚝 박힌다.</li>' +
      '<li>매월 10일은 월급날. PX에서 산 아이템으로 위험한 스탯을 조절하자.</li>' +
      '<li>휴가는 진급할 때마다, 그리고 특급전사·특등사수 같은 포상으로 받는다.</li>' +
      '<li>남은 휴가가 전역까지 남은 날보다 많으면 말년휴가를 나가 그대로 전역할 수 있다.</li>' +
      '<li>간부 신뢰가 너무 낮으면 진급 심사에서 누락된다(2026년부터 자동 진급 폐지).</li>' +
      '</ul><div class="modal-actions"><button class="btn btn-primary" data-act="close">알겠습니다!</button></div>',
    function (box) { box.querySelector('[data-act="close"]').onclick = closeModal; });
  }

  /* ── 엔딩 ───────────────────────────── */
  function showEnding() {
    busy = false;
    var o = state.over;
    var E = JY.ENDINGS[o.id] || JY.ENDINGS.normal;
    meta.endings = meta.endings || {};
    o.list.forEach(function (id) { meta.endings[id] = (meta.endings[id] || 0) + 1; });
    meta.best = Math.max(meta.best || 0, o.day);
    if (o.good) meta.discharges = (meta.discharges || 0) + 1;
    lsSet(KEYS.meta, meta);
    lsDel(KEYS.save);
    var b = G.bank(state);
    var art = A.scene(E.bg, state.season) + charSVG(E.who, { mood: E.mood, meMood: E.mood, catCap: true });
    var also = o.list.slice(1).filter(function (id) { return id !== 'normal'; }).map(function (id) { return JY.ENDINGS[id].title; });
    var log = state.log.slice(-7).map(function (l) { return '<li>' + G.dateOf(state, l.day) + ' · ' + esc(l.text) + '</li>'; }).join('');
    var served = o.day + (o.good ? 1 : 0);
    $('#cert').className = 'cert ' + (o.good ? 'good' : 'bad');
    $('#cert').innerHTML =
      '<div class="cert-head"><small>' + (o.good ? '띨빵사단 인사과' : '띨빵사단 중대 행정반') + '</small><h2>' + (o.good ? '전 역 증' : '전역 보류 통지서') + '</h2></div>' +
      '<div class="cert-art">' + art + '</div>' +
      '<h3 class="ending-title">' + esc(E.title) + '</h3>' +
      '<p class="ending-text">' + esc(E.text) + '</p>' +
      (also.length ? '<p class="also">추가 달성: ' + also.map(esc).join(' · ') + '</p>' : '') +
      '<dl>' +
      '<dt>성명</dt><dd>' + G.RANKS[state.rank] + ' ' + esc(state.name) + '</dd>' +
      '<dt>보직</dt><dd>' + G.MOS[state.mos].name + '</dd>' +
      '<dt>복무 기간</dt><dd>' + G.dateOf(state, 0) + ' ~ ' + (o.good ? G.fmtDate(state.end) : G.dateOf(state) + ' (중단)') + '</dd>' +
      '<dt>복무 일수</dt><dd>' + served + '일 / ' + (state.total + 1) + '일 (' + Math.round(served / (state.total + 1) * 100) + '%)</dd>' +
      '<dt>넘긴 카드</dt><dd>' + state.cards + '장 · 미니게임 ' + state.minis.played + '회</dd>' +
      '<dt>사용한 휴가</dt><dd>' + state.leaveUsed + '일</dd>' +
      '<dt>' + (o.good ? '전역 통장' : '통장 잔고') + '</dt><dd>' + won(b.total) + (o.good ? ' (적금 매칭 포함)' : '') + '</dd>' +
      '</dl>' +
      (log ? '<ul class="log">' + log + '</ul>' : '') +
      '<div class="seal">' + (o.good ? '전역' : '보류') + '</div>';
    showScreen('scr-end');
    $('#scr-end').scrollTop = 0;
    if (o.good) { snd('win'); confetti(); } else { snd('fail'); if (JY.buzz) JY.buzz([80, 60, 80, 60, 200]); }
    state = null;
  }

  /* ── 도감 ───────────────────────────── */
  function renderAlbum(back) {
    var got = meta.endings || {};
    var ids = JY.ENDING_ORDER;
    var n = ids.filter(function (id) { return got[id]; }).length;
    $('#album-progress').textContent = n + '/' + ids.length;
    $('#album-grid').innerHTML = ids.map(function (id) {
      var E = JY.ENDINGS[id];
      if (!got[id]) {
        return '<div class="album-card locked ' + (E.good ? 'good' : 'bad') + '"><div class="thumb">?</div><b>' + (E.good ? '전역 엔딩' : '실패 엔딩') + '</b><small>힌트: ' + HINTS[id] + '</small></div>';
      }
      return '<div class="album-card ' + (E.good ? 'good' : 'bad') + '"><div class="thumb">' + A.scene(E.bg, 'spring') + charSVG(E.who, { mood: E.mood, meMood: E.mood, catCap: true, rank: E.good ? 4 : 2 }) + '</div><b>' + esc(E.title) + '</b><small>' + got[id] + '회 달성</small></div>';
    }).join('');
    $('#album-stats').textContent = '입대 ' + (meta.runs || 0) + '회 · 전역 ' + (meta.discharges || 0) + '회 · 최장 복무 ' + (meta.best || 0) + '일';
    $('#btn-album-back').onclick = back || renderTitle;
    showScreen('scr-album');
  }

  /* ── 설정 ───────────────────────────── */
  function applySettings() {
    lsSet(KEYS.settings, settings);
    JY.settings = settings;
    if (JY.Sound) JY.Sound.setEnabled(settings.sound);
  }

  /* ── 시작 ───────────────────────────── */
  function continueGame(s) {
    state = s;
    busy = false;
    showScreen('scr-game');
    renderHUD();
    if (state.pendingMini) { busy = true; runMini({ mini: state.pendingMini.id, say: '', deltas: {}, events: [] }); return; }
    renderCard(true);
  }

  function init(data) {
    meta = lsGet(KEYS.meta, null) || { endings: {}, runs: 0, discharges: 0, best: 0 };
    meta.endings = meta.endings || {};
    settings = lsGet(KEYS.settings, null) || { sound: true, vibe: true };
    applySettings();
    buildStats();
    bindSwipe();

    $('#btn-new').onclick = function () { if (JY.Sound) JY.Sound.unlock(); snd('tap'); renderSetup(); };
    $('#btn-continue').onclick = function () { if (JY.Sound) JY.Sound.unlock(); var s = loadSave(); if (s) continueGame(s); };
    $('#btn-album').onclick = function () { renderAlbum(renderTitle); };
    $('#btn-face').onclick = function () { setup.face = randomFace(); snd('tap'); updateSetupPreview(); };
    $('#in-name').addEventListener('input', updateSetupPreview);
    $('#in-date').addEventListener('change', updateDateNote);
    $('#in-date').addEventListener('input', updateDateNote);
    $('#mos-grid').addEventListener('click', function (e) {
      var b = e.target.closest('.mos'); if (!b) return;
      setup.mos = b.dataset.mos; snd('tap');
      document.querySelectorAll('.mos').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
    });
    $('#btn-setup-back').onclick = renderTitle;
    $('#setup-form').addEventListener('submit', function (e) { e.preventDefault(); if (JY.Sound) JY.Sound.unlock(); startGame(); });

    $('#dock-bag').onclick = openBag;
    $('#dock-px').onclick = openPX;
    $('#dock-leave').onclick = openLeave;
    $('#dock-menu').onclick = openMenu;
    $('#modal').addEventListener('click', function (e) { if (e.target.id === 'modal') closeModal(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });

    $('#btn-reenlist').onclick = function () { renderSetup(); };
    $('#btn-end-album').onclick = function () { renderAlbum(function () { showScreen('scr-end'); }); };
    $('#btn-end-title').onclick = renderTitle;

    window.addEventListener('resize', fitCard);
    window.addEventListener('orientationchange', function () { setTimeout(fitCard, 200); });
    document.addEventListener('visibilitychange', function () { if (document.hidden) save(); });

    var restored = data && data.save && data.save.v === 1 && !data.save.over ? data.save : null;
    if (restored) continueGame(restored);
    else renderTitle();

    try {
      if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
        window.claude.hot.snapshot(function () { return { save: state && !state.over ? state : null }; });
      }
    } catch (e) { /* 뷰어 밖 */ }

    try {
      if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !/claude/.test(location.hostname)) {
        navigator.serviceWorker.register('sw.js').catch(function () { /* 오프라인 캐시 실패는 무시 */ });
      }
    } catch (e) { /* 무시 */ }
  }

  JY.UI = { init: init, charSVG: charSVG, _state: function () { return state; } };

  var hot = window.claude && window.claude.hot;
  function boot() {
    if (hot && hot.ready) hot.ready(init);
    else init((hot && hot.data) || {});
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(window.JY = window.JY || {});

</script>
</body>
</html>
