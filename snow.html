<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#16233a">
<title>제설각</title>
<link rel="icon" href="icons/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap">
<link rel="stylesheet" href="css/snow.css">
</head>
<body>
<!-- build:body -->
<div id="app">
  <canvas id="cv" aria-label="제설 작업 화면"></canvas>

  <header id="hud" hidden>
    <div class="hud-top">
      <div class="pill rank"><span id="h-ins" class="ins"></span><span class="rank-txt"><b id="h-day">1일차</b><small id="h-wx">눈</small></span></div>
      <div class="carry" id="h-carry" aria-label="짊어진 눈"><svg viewBox="0 0 44 44" aria-hidden="true"><circle class="tr-bg" cx="22" cy="22" r="19"/><circle id="h-cring" class="tr-fg" cx="22" cy="22" r="19"/></svg><span class="carry-t"><b id="h-load">0</b><small id="h-cap">/40</small></span><em>짊어진 눈</em></div>
      <div class="pill bank"><i class="pie" aria-hidden="true"></i><b id="h-bank">0</b><i class="dia" aria-hidden="true"></i><b id="h-dia" class="dia-n">0</b></div>
    </div>
    <div id="goal" class="goal"><i id="g-dot" class="g-dot"></i><div class="g-txt"><b id="g-t">작전 준비</b><small id="g-s"></small></div><div class="g-bar"><em id="g-f"></em></div></div>
    <div class="prog" id="h-prog" hidden><span id="h-area" class="area">부대 전체</span><div class="bar"><i id="h-fill"></i></div><b id="h-pct">0%</b></div>
    <div class="hud-btns"><button id="h-pause" class="scan" aria-label="작전 일시 정지"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.2" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.2" fill="currentColor"/></svg><span class="lbl">정지</span></button><button id="h-speed" class="scan speed" hidden aria-label="작업 속도 바꾸기"><b id="h-speed-t">×1</b><span class="lbl">말년 특권</span></button><button id="h-box" class="scan boxb" hidden aria-label="보급 상자 열기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l9-5 9 5v9l-9 4-9-4z" fill="#c9a24a" stroke="#6b5420" stroke-width="1.4" stroke-linejoin="round"/><path d="M3 9l9 4 9-4M12 13v9" stroke="#6b5420" stroke-width="1.4" fill="none"/><path d="M8 6.5l9 4.5" stroke="#e33" stroke-width="2"/></svg><span class="lbl">상자</span><i id="h-box-n">0</i></button><button id="h-cam" class="scan" aria-label="시점 바꾸기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h4l2-3h6l2 3h4v11H3z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.4" fill="none" stroke="currentColor" stroke-width="2.2"/></svg><span id="h-cam-t" class="lbl">시점</span></button>
    <button id="h-scan" class="scan" aria-label="남은 눈 표시"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6" fill="none" stroke="currentColor" stroke-width="2.6"/><path d="M15 15l5 5" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/></svg><span class="lbl">남은 눈</span></button></div>
  </header>
  <button id="h-shop" class="shopbtn" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h16l-1.5 11h-13z" fill="currentColor"/><path d="M8 9V7a4 4 0 0 1 8 0v2" fill="none" stroke="currentColor" stroke-width="2"/></svg>보급·인력<i id="h-shop-n" hidden></i></button>
  <div id="flash" hidden></div>
  <div id="stack">
  <div id="fever" hidden><b>폭풍 제설!</b><span id="fever-t">눈 값 ×2</span></div>
  <div id="surge" hidden><b>폭설 경보</b><span id="surge-t"></span></div>
  <div id="combo" hidden><b id="combo-n">x0</b><span id="combo-t"></span></div>
  <div id="banner" hidden></div>
  <div id="salute" hidden><b id="sal-t">중대장님이다!</b><span>경례!</span><i><em id="sal-f"></em></i></div>
  <div id="say" hidden><div class="say-face" id="say-face"></div><p id="say-text"></p></div>
  <div id="chip" hidden></div>
  <div id="sub" hidden></div>
  <div id="hint" hidden><b>화면 아무 데나 끌면 걷는다</b><span>넉가래는 알아서 민다 · <em>노란 화살표</em>를 따라가라</span></div>
  </div>
  <div id="splat" hidden><svg viewBox="0 0 200 200" aria-hidden="true"><path d="M100 18c14 0 18 26 30 30s34-14 42 0-18 26-12 40 30 22 22 36-34 4-42 16 2 40-14 44-22-26-36-26-30 26-42 14 6-34-6-44-36-6-36-22 30-16 30-32-22-30-10-40 30 8 40 0 10-56 18-56z" fill="#fbfdff" stroke="#c9d8e6" stroke-width="4"/><circle cx="160" cy="40" r="10" fill="#fbfdff"/><circle cx="40" cy="168" r="8" fill="#fbfdff"/><circle cx="178" cy="150" r="6" fill="#fbfdff"/></svg><b>누가 던졌어!!</b></div>

  <div id="xhair" hidden><i></i><span id="xh-t"></span></div>
  <div id="side" hidden>
    <div id="h-op" class="opcard" hidden><b><span id="op-title">작업 지시서</span><i id="op-n">0/1</i></b><ol id="op-list"></ol><p id="op-warn" class="op-warn" hidden></p><p id="op-bonus" class="op-bonus" hidden></p><small id="op-tip" class="op-tip" hidden></small></div>
    <div id="h-reqs" class="reqs"></div>
    <button id="h-hand" class="hand" hidden aria-label="들고 있는 물건 내려놓기"><span>손에 든 것</span><b id="h-hand-n"></b><i>✕</i></button>
    <div id="h-buffs" class="buffs"></div>
  </div>
  <button id="throw-btn" class="throwb" hidden aria-label="눈덩이 던지기"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8" fill="#f4f8fc" stroke="#9fb3c8" stroke-width="1.6"/><circle cx="9" cy="11" r="1.6" fill="#d5e2ef"/><circle cx="14.5" cy="15" r="1.2" fill="#d5e2ef"/><path d="M17 4l2-2M20 7l2-1M14 3l.5-2" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg><b>눈덩이</b><small id="throw-n"></small></button>
  <div id="acts" hidden>
    <div class="act-col"><button id="act2-btn" class="act2" hidden></button><button id="act-btn" class="actb" aria-label="행동"><small id="act-name"></small><b id="act-verb">행동</b></button></div>
  </div>
  <div id="fade" hidden></div>
  <div id="coins" aria-hidden="true"></div>

  <section id="splash" class="screen splash" hidden>
    <div class="sp-in">
      <p class="sp-kicker">전역각 외전</p>
      <h1 class="sp-logo"><span>제설각</span></h1>
      <p class="sp-tag">새벽 제설 비상 · 짬이 차면 편해진다</p>
      <div class="sp-tap" id="sp-go">화면을 눌러 시작</div>
    </div>
  </section>

  <section id="title" class="screen lobby">
    <div class="lb-top">
      <div id="hub-card" class="lb-card"></div>
      <div class="lb-cur"><span class="lb-c"><i class="pie" aria-hidden="true"></i><b id="lb-bank">0</b></span><span class="lb-c"><i class="dia" aria-hidden="true"></i><b id="lb-dia">0</b></span></div>
    </div>
    <nav class="lb-side lb-left" aria-label="기록">
      <button data-hub="help"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5c3-1.4 6-1.4 9 .6v14c-3-2-6-2-9-.6z" fill="#ffd24a"/><path d="M21 5c-3-1.4-6-1.4-9 .6v14c3-2 6-2 9-.6z" fill="#f2e6c9"/><path d="M6 9h3M6 12h3M15 9h3M15 12h3" stroke="#6b5420" stroke-width="1.4"/></svg><b>교범</b></button>
      <button data-hub="medal"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2h4l1 6-3 1zM17 2h-4l-1 6 3 1z" fill="#c8402e"/><circle cx="12" cy="15" r="6.5" fill="#ffd24a" stroke="#a87a12" stroke-width="1.5"/><path d="M12 11.5l1.1 2.3 2.5.3-1.8 1.7.5 2.5-2.3-1.2-2.3 1.2.5-2.5-1.8-1.7 2.5-.3z" fill="#a87a12"/></svg><b>훈장</b></button>
      <button data-hub="story"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2" fill="#6b8f4e"/><rect x="7.5" y="5.5" width="9" height="13" rx="1" fill="#f4f0e4"/><path d="M9 9h6M9 12h6M9 15h4" stroke="#6b7064" stroke-width="1.4"/></svg><b>수첩</b></button>
      <button data-hub="look"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="7" fill="#f6c79c" stroke="#23281e" stroke-width="1.4"/><path d="M5 11c0-5 14-5 14 0z" fill="#4d5b31" stroke="#23281e" stroke-width="1.4"/><circle cx="9.5" cy="13.5" r="1.2"/><circle cx="14.5" cy="13.5" r="1.2"/><path d="M10 16.5q2 1.4 4 0" stroke="#23281e" stroke-width="1.3" fill="none"/></svg><b>꾸미기</b></button>
      <button data-hub="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l1.8 2.6 3-.9.5 3.1 3 .9-1 3 2 2.3-2.6 1.8.9 3-3.1.5-.9 3-3-1L12 22l-1.8-2.6-3 .9-.5-3.1-3-.9 1-3L2.7 11l2.6-1.8-.9-3 3.1-.5.9-3 3 1z" fill="#c9d6e6"/><circle cx="12" cy="12" r="3.6" fill="#22344f"/></svg><b>설정</b></button>
    </nav>
    <nav class="lb-side lb-right" id="hub-grid" aria-label="생활관">
      <button data-hub="shop"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8l9-4.5L21 8v9l-9 4.5L3 17z" fill="#c9a24a" stroke="#6b5420" stroke-width="1.2" stroke-linejoin="round"/><path d="M3 8l9 4.5L21 8M12 12.5v9" stroke="#6b5420" stroke-width="1.2" fill="none"/><path d="M7.5 5.8l9 4.5" stroke="#d23a2a" stroke-width="2"/></svg><b>보급</b><i id="hub-shop-n" hidden></i></button>
      <button data-hub="px"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="3" width="10" height="18" rx="2" fill="#2f8f5b"/><rect x="7" y="8" width="10" height="7" fill="#f4d35e"/><rect x="9" y="1.5" width="6" height="2" rx="1" fill="#c9d6e6"/></svg><b>PX</b></button>
      <button data-hub="phone"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3l3.5 1 1 4.5-2.2 1.5a11 11 0 0 0 5.7 5.7l1.5-2.2 4.5 1 1 3.5c-1 2-3.3 3-5.5 2.3A16 16 0 0 1 3.7 8.5C3 6.3 4 4 6 3z" fill="#e2564a"/></svg><b>전화</b><i id="hub-phone-n" hidden>!</i></button>
      <button data-hub="pull"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h18" stroke="#c9d6e6" stroke-width="2.4" stroke-linecap="round"/><path d="M9 4l1 5M15 4l-1 5" stroke="#f6c79c" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="11" r="2.6" fill="#f6c79c"/><path d="M9 14h6l-1 7h-4z" fill="#6b8f4e"/></svg><b>체력단련</b></button>
      <button data-hub="leave" id="hub-leave"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v10H3z" fill="#f2e6c9"/><path d="M3 11l9-7 9 7" stroke="#c8402e" stroke-width="2.2" fill="none" stroke-linejoin="round"/><path d="M12 19s-3.5-2.2-3.5-4.4a1.9 1.9 0 0 1 3.5-1 1.9 1.9 0 0 1 3.5 1C15.5 16.8 12 19 12 19z" fill="#e2564a"/></svg><b>휴가</b><i id="hub-leave-n" hidden>!</i></button>
    </nav>
    <div class="lb-bottom">
      <div id="hub" class="lb-info"></div>
      <button id="t-start" class="lb-go"><b id="t-start-b">제설 출동</b><small id="t-start-s"></small></button>
    </div>
  </section>


  <section id="shop" class="screen dim" hidden>
    <div class="shop">
      <header class="shop-head">
        <button id="s-back" class="back" aria-label="처음 화면으로">‹</button>
        <h2>보급</h2>
        <div class="pill bank light"><i class="pie" aria-hidden="true"></i><b id="s-bank">0</b></div>
      </header>
      <nav id="s-tabs" class="tabs" role="tablist"></nav>
      <div id="s-list" class="list"></div>
      <footer class="shop-foot"><button id="s-go" class="btn big">생활관으로</button></footer>
    </div>
  </section>

  <div id="talk" hidden><div class="talk-box"><div class="talk-face" id="talk-face"></div><div class="talk-body"><p class="talk-who" id="talk-who"></p><p class="talk-text" id="talk-text"></p><div class="talk-name" id="talk-name" hidden><input id="talk-input" maxlength="6" placeholder="이름 (최대 6자)" autocomplete="off"><button id="talk-ok" class="btn big">이걸로</button></div><span class="talk-next" id="talk-next">▶</span></div></div><p class="talk-title" id="talk-title"></p></div>
  <div id="modal" hidden><div class="modal-box" id="modal-box"></div></div>
  <div id="toast" hidden></div>
</div>
<!-- /build:body -->
<script src="js/art.js"></script>
<script src="js/data/chars.js"></script>
<script src="js/snow/data.js"></script>
<script src="js/snow/sim.js"></script>
<script src="js/snow/act.js"></script>
<script src="js/snow/meta.js"></script>
<script src="js/snow/sfx.js"></script>
<script src="js/vendor/three.min.js"></script>
<script src="js/snow/view.js"></script>
<script src="js/snow/view3d.js"></script>
<script src="js/snow/ui.js"></script>
</body>
</html>
