<style>
/* 제설각 — 겨울 새벽 부대: 남색 하늘, 눈, 올리브 군복, 넉가래 노랑 */
:root {
  --navy: #16233a; --navy-2: #22344f; --snow: #f5f8fb; --olive: #4d5b31; --olive-d: #2c361c;
  --gold: #ffd24a; --gold-d: #b8860b; --red: #c8402e; --paper: #f4f0e4; --card: #fffdf7; --ink: #23281e; --mute: #6b7064; --line: #e3dccb;
  --f-title: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; background: var(--navy); color: var(--ink); font-family: var(--f-body); overflow: hidden; overscroll-behavior: none; }
button { font: inherit; color: inherit; }
#app { position: fixed; inset: 0; overflow: hidden; user-select: none; -webkit-user-select: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
[hidden] { display: none !important; }

/* 초코파이 */
.pie { display: inline-block; width: 15px; height: 15px; border-radius: 50%; flex: none; vertical-align: -2px;
  background: radial-gradient(circle at 34% 32%, #a26a43 0 22%, #5e3620 24% 100%); box-shadow: inset 0 -1.5px 0 rgba(0,0,0,.3), 0 0 0 1.5px #3a2012; }

/* ── HUD ── */
#hud { position: absolute; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top, 0px) + 8px) max(10px, env(safe-area-inset-right, 0px)) 0 max(10px, env(safe-area-inset-left, 0px)); pointer-events: none; display: grid; gap: 7px; max-width: 560px; margin: 0 auto; }
.hud-top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 7px; background: rgba(14,24,42,.74); color: #fff; border-radius: 999px; padding: 6px 13px 6px 8px; box-shadow: 0 2px 10px rgba(0,0,0,.18); min-width: 0; }
.pill.rank { justify-self: start; }
.pill.bank { justify-self: end; padding: 7px 14px 7px 11px; }
.pill.bank b { font-family: var(--f-title); font-weight: 400; font-size: 17px; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.pill.light { background: #fff; color: var(--ink); box-shadow: inset 0 0 0 2px var(--line); }
.ins { display: inline-flex; }
.ins svg { width: 28px; height: 21px; display: block; }
.rank-txt { display: grid; line-height: 1.1; }
.rank-txt b { font-family: var(--f-title); font-weight: 400; font-size: 15px; }
.rank-txt small { font-size: 11.5px; color: #c9d6e6; }
.timer { position: relative; width: 54px; height: 54px; display: grid; place-items: center; }
.timer svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.tr-bg { fill: rgba(14,24,42,.78); stroke: rgba(255,255,255,.22); stroke-width: 4; }
.tr-fg { fill: none; stroke: var(--gold); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 119.4; stroke-dashoffset: 0; transition: stroke-dashoffset .2s linear; }
.timer b { position: relative; font-family: var(--f-title); font-weight: 400; font-size: 20px; color: #fff; font-variant-numeric: tabular-nums; }
.timer.late .tr-fg { stroke: #ff6a55; }
.timer.late b { color: #ffb3a8; animation: beat .5s ease-in-out infinite alternate; }
@keyframes beat { to { transform: scale(1.18); } }
.prog { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 8px; }
.bar { position: relative; height: 14px; border-radius: 99px; background: rgba(14,24,42,.62); box-shadow: inset 0 0 0 2px rgba(255,255,255,.3); overflow: visible; }
.bar i { position: absolute; left: 2px; top: 2px; bottom: 2px; width: 0; max-width: calc(100% - 4px); border-radius: 99px; background: linear-gradient(90deg, #7cc6ff, #b9e3ff); transition: width .25s; }
#hud.goal-ok .bar i { background: linear-gradient(90deg, #4fcf74, #a9f0b9); }
.bar em { position: absolute; top: -4px; bottom: -4px; width: 3px; margin-left: -1.5px; background: #fff; border-radius: 2px; box-shadow: 0 0 0 1.5px rgba(14,24,42,.6); }
#h-pct { font-family: var(--f-title); font-weight: 400; color: #fff; font-size: 17px; min-width: 44px; text-align: right; text-shadow: 0 1px 3px rgba(0,0,0,.5); font-variant-numeric: tabular-nums; }
.pause { pointer-events: auto; width: 34px; height: 34px; border-radius: 50%; border: 0; background: rgba(14,24,42,.74); display: inline-flex; align-items: center; justify-content: center; gap: 4px; cursor: pointer; }
.pause span { width: 4px; height: 13px; background: #fff; border-radius: 2px; }

/* 행보관 말풍선 */
#say { position: absolute; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 98px); width: min(calc(100% - 20px), 420px); display: flex; align-items: flex-end; gap: 8px; pointer-events: none; z-index: 6; }
#say.in { animation: say-in .28s cubic-bezier(.2,1.4,.5,1); }
@keyframes say-in { from { transform: translateX(-50%) translateY(-12px) scale(.94); opacity: 0; } }
.say-face { width: 58px; height: 58px; border-radius: 50%; background: #dfe6d3; overflow: hidden; flex: none; box-shadow: 0 0 0 3px #fff, 0 4px 12px rgba(0,0,0,.25); }
.say-face svg { width: 100%; height: 100%; display: block; }
#say p { margin: 0; background: #fff; color: var(--ink); padding: 10px 14px; border-radius: 16px 16px 16px 4px; font-size: 16px; line-height: 1.35; box-shadow: 0 4px 14px rgba(0,0,0,.2); }

#banner { position: absolute; left: 50%; top: 34%; transform: translate(-50%, -50%); text-align: center; color: #fff; pointer-events: none; display: grid; gap: 6px; width: min(92%, 420px); z-index: 5; }
#banner b { font-family: var(--f-title); font-weight: 400; font-size: 34px; text-shadow: 0 3px 0 #2b4466, 0 8px 24px rgba(0,0,0,.45); }
#banner span { font-size: 16px; background: rgba(14,24,42,.7); border-radius: 99px; padding: 6px 14px; justify-self: center; }
#banner.in { animation: banner 2.2s ease forwards; }
@keyframes banner { 0% { opacity: 0; transform: translate(-50%, -40%) scale(.9); } 12% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -58%); } }

#hint { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 34px); transform: translateX(-50%); width: min(calc(100% - 32px), 380px); background: rgba(14,24,42,.82); color: #fff; border-radius: 16px; padding: 12px 16px; text-align: center; display: grid; gap: 3px; pointer-events: none; animation: hint 1.4s ease-in-out infinite alternate; }
#hint b { font-size: 17px; color: var(--gold); font-weight: 400; }
#hint span { font-size: 14px; color: #d6e1ee; }
@keyframes hint { to { transform: translateX(-50%) translateY(-6px); } }

/* ── 화면 ── */
.screen { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: calc(env(safe-area-inset-top, 0px) + 16px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 16px) max(16px, env(safe-area-inset-left, 0px)); z-index: 4; }
.screen.dim { background: rgba(10,18,32,.5); }
#title { background: linear-gradient(180deg, rgba(20,33,56,.82) 0%, rgba(20,33,56,.25) 42%, rgba(20,33,56,.25) 58%, rgba(20,33,56,.85) 100%); }
.title-box { display: grid; justify-items: center; gap: 10px; text-align: center; width: min(100%, 380px); }
.kicker { margin: 0; font-size: 13px; letter-spacing: .14em; color: var(--gold); }
.card .kicker, .modal-box .kicker, .dis .kicker { color: #8a6200; }
#say.low { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 150px); }
.logo { margin: 4px 0 0; position: relative; font-family: var(--f-title); font-weight: 400; font-size: clamp(72px, 24vw, 104px); line-height: 1; color: #fff; letter-spacing: .04em;
  text-shadow: 0 4px 0 #9fb6cd, 0 8px 0 #6f8aa6, 0 22px 36px rgba(0,0,0,.45); }
.tag { margin: 2px 0 6px; font-size: 18px; color: #e5edf5; text-shadow: 0 1px 4px rgba(0,0,0,.4); }
.t-info { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px 8px; background: rgba(14,24,42,.7); color: #fff; border-radius: 16px; padding: 9px 14px; font-size: 15px; }
.t-info .ins svg { width: 26px; height: 20px; }
.t-info b { font-family: var(--f-title); font-weight: 400; font-size: 16px; }
.t-info .sep { width: 1px; height: 14px; background: rgba(255,255,255,.3); }
.t-btns { display: grid; gap: 10px; width: 100%; margin-top: 8px; }

.btn { border: 0; border-radius: 14px; padding: 14px 20px; font-size: 18px; cursor: pointer; transition: transform .08s, box-shadow .08s; }
.btn:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.btn.big { background: var(--gold); color: #2a2208; box-shadow: 0 5px 0 var(--gold-d), 0 10px 22px rgba(0,0,0,.22); }
.btn.big:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--gold-d), 0 4px 10px rgba(0,0,0,.2); }
.btn.big:disabled { background: #d8d2c2; color: #8a8475; box-shadow: 0 5px 0 #b8b2a2; cursor: default; }
.btn.ghost { background: rgba(255,255,255,.14); color: #fff; box-shadow: inset 0 0 0 2px rgba(255,255,255,.55); }
.card .btn.ghost, .modal-box .btn.ghost { background: #fff; color: var(--ink); box-shadow: inset 0 0 0 2px var(--line), 0 4px 0 #d6cfbd; }
.btn.link { background: none; color: rgba(255,255,255,.75); font-size: 14px; padding: 8px; text-decoration: underline; text-underline-offset: 3px; }

/* 검열 결과 */
.card { background: var(--card); border-radius: 20px; width: min(100%, 400px); max-height: 100%; overflow: auto; padding: 18px; box-shadow: 0 20px 50px rgba(0,0,0,.35); display: grid; gap: 14px; }
.res { animation: card-in .35s cubic-bezier(.2,1.3,.5,1); }
@keyframes card-in { from { transform: translateY(30px) scale(.96); opacity: 0; } }
.res-head { display: flex; align-items: center; gap: 12px; }
.face { width: 64px; height: 64px; border-radius: 50%; background: #dfe6d3; overflow: hidden; flex: none; box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--line); }
.face svg { width: 100%; height: 100%; display: block; }
.res-head h2 { margin: 2px 0 0; font-family: var(--f-title); font-weight: 400; font-size: 24px; }
.res-pct { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #eef2e6; border-radius: 16px; padding: 12px 16px; }
.res-pct > div:first-child { display: grid; }
.res-pct b { font-family: var(--f-title); font-weight: 400; font-size: 54px; line-height: 1; color: var(--olive-d); }
.res-pct b small { font-size: 26px; }
.res-pct span { font-size: 14px; color: var(--mute); }
.stamp { font-family: var(--f-title); font-size: 30px; padding: 6px 12px; border: 4px solid currentColor; border-radius: 10px; transform: rotate(-12deg); animation: stamp .45s .3s cubic-bezier(.3,1.6,.5,1) both; white-space: nowrap; background: rgba(255,255,255,.4); }
.g-S { color: #c0392b; } .g-A { color: #2d6cb5; } .g-B { color: #b9700f; } .g-C { color: #4c4c4c; }
@keyframes stamp { from { transform: rotate(-12deg) scale(2.6); opacity: 0; } to { transform: rotate(-12deg) scale(1); opacity: 1; } }
.res-lines { list-style: none; margin: 0; padding: 0; display: grid; }
.res-lines li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 2px; border-bottom: 1.5px dashed var(--line); font-size: 15.5px; }
.res-lines li span { color: var(--mute); }
.res-lines li b { font-weight: 400; display: inline-flex; align-items: center; gap: 5px; font-variant-numeric: tabular-nums; }
.res-lines li.early b { color: #2f8f4e; }
.res-say { margin: 0; font-size: 17px; color: var(--ink); text-align: center; }
.res-total { display: flex; justify-content: space-between; align-items: center; background: var(--navy); color: #fff; border-radius: 14px; padding: 10px 14px; }
.res-total b { font-family: var(--f-title); font-weight: 400; font-size: 22px; display: inline-flex; align-items: center; gap: 7px; }
.res-btns { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; }

/* 보급·인력 */
#shop { align-items: flex-end; padding-bottom: 0; }
.shop { width: min(100%, 560px); height: min(100%, 860px); background: var(--paper); border-radius: 22px 22px 0 0; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 -10px 40px rgba(0,0,0,.3); animation: sheet .3s ease-out; }
@keyframes sheet { from { transform: translateY(40px); opacity: 0; } }
.shop-head { display: flex; align-items: center; gap: 10px; padding: 14px 14px 8px; }
.shop-head h2 { margin: 0; flex: 1; font-family: var(--f-title); font-weight: 400; font-size: 22px; min-width: 0; }
.back { width: 38px; height: 38px; border-radius: 12px; border: 0; background: #fff; box-shadow: inset 0 0 0 2px var(--line); font-size: 26px; line-height: 1; cursor: pointer; }
.tabs { display: flex; gap: 6px; padding: 4px 14px 10px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { position: relative; flex: none; border: 0; border-radius: 99px; padding: 9px 16px; background: #fff; box-shadow: inset 0 0 0 2px var(--line); font-size: 16px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--olive); color: #fff; box-shadow: none; }
.tabs .dot { position: absolute; top: -5px; right: -4px; min-width: 19px; height: 19px; border-radius: 10px; background: var(--red); color: #fff; font-style: normal; font-size: 12px; line-height: 19px; padding: 0 5px; box-shadow: 0 0 0 2px var(--paper); }
.list { flex: 1; overflow-y: auto; padding: 4px 14px 14px; display: grid; gap: 10px; align-content: start; -webkit-overflow-scrolling: touch; }
.item { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 11px; align-items: center; background: var(--card); border-radius: 16px; padding: 10px; box-shadow: inset 0 0 0 2px var(--line); }
.item.can { box-shadow: inset 0 0 0 2.5px var(--gold), 0 3px 0 #e8d9a6; }
.item.s-own.cur { box-shadow: inset 0 0 0 2.5px var(--olive); }
.item.s-lock, .item.s-later { opacity: .62; }
.ico { width: 56px; height: 56px; border-radius: 14px; background: linear-gradient(180deg, #e9f0f5, #d6e1ea); overflow: hidden; display: grid; place-items: center; }
.ico-cv { width: 56px; height: 56px; display: block; }
.ico-svg svg { width: 36px; height: 36px; display: block; }
.info { min-width: 0; display: grid; gap: 1px; }
.info b { font-size: 17px; font-weight: 400; }
.info small { font-size: 13px; color: var(--olive); }
.info p { margin: 2px 0 0; font-size: 13.5px; color: var(--mute); line-height: 1.35; }
.buy { min-width: 92px; border: 0; border-radius: 12px; padding: 10px 10px; background: var(--gold); color: #2a2208; font-size: 15.5px; display: inline-flex; align-items: center; justify-content: center; gap: 5px; cursor: pointer; box-shadow: 0 4px 0 var(--gold-d); font-variant-numeric: tabular-nums; }
.buy:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--gold-d); }
.buy.short { background: #ebe5d5; color: #8a8475; box-shadow: 0 4px 0 #d3ccb9; }
.buy:disabled { background: transparent; color: #8a8475; box-shadow: inset 0 0 0 2px #d6cfbd; cursor: default; font-size: 13.5px; }
.buy.nope { animation: nope .32s; }
@keyframes nope { 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }
.empty { text-align: center; color: var(--mute); padding: 30px 10px; font-size: 16px; }
.shop-foot { padding: 10px 14px calc(env(safe-area-inset-bottom, 0px) + 12px); background: linear-gradient(180deg, rgba(244,240,228,0), var(--paper) 30%); }
.shop-foot .btn { width: 100%; }

.dis { background: var(--card); border-radius: 16px; padding: 18px; display: grid; gap: 10px; justify-items: center; text-align: center; box-shadow: inset 0 0 0 2px var(--line); }
.dis h3 { margin: 0; font-family: var(--f-title); font-weight: 400; font-size: 26px; }
.dis p { margin: 0; color: var(--mute); font-size: 15px; line-height: 1.45; }
.dis-ins svg { width: 64px; height: 48px; }
.dis-bar { width: 100%; height: 14px; border-radius: 99px; background: #e6e0d0; overflow: hidden; }
.dis-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--olive), #7f9a4c); }
.dis-num { font-size: 13.5px !important; }
.dis .res-lines { width: 100%; }
.dis .btn { width: 100%; }

/* 모달·토스트 */
#modal { position: fixed; inset: 0; background: rgba(10,16,28,.58); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 20; }
.modal-box { width: min(100%, 360px); background: var(--card); border-radius: 20px; padding: 22px 18px 18px; box-shadow: 0 20px 50px rgba(0,0,0,.4); animation: card-in .3s cubic-bezier(.2,1.3,.5,1); }
.m-rank { display: grid; gap: 10px; justify-items: center; text-align: center; }
.m-rank h3 { margin: 0; font-family: var(--f-title); font-weight: 400; font-size: 28px; }
.m-rank p { margin: 0; color: var(--mute); font-size: 15.5px; line-height: 1.45; }
.m-rank p b { color: var(--ink); font-weight: 400; }
.m-rank .btn { width: 100%; margin-top: 4px; }
.m-rank .res-btns { width: 100%; }
.m-ins svg { width: 84px; height: 63px; animation: stamp .5s cubic-bezier(.3,1.6,.5,1) both; }
.m-face { width: 76px; height: 76px; border-radius: 50%; overflow: hidden; background: #dfe6d3; }
.m-face svg { width: 100%; height: 100%; }
.m-big { font-family: var(--f-title); font-size: 34px !important; color: var(--ink) !important; display: inline-flex; align-items: center; gap: 8px; }
.m-big .pie { width: 26px; height: 26px; }
#toast { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 96px); transform: translateX(-50%); background: rgba(14,24,42,.9); color: #fff; padding: 10px 18px; border-radius: 99px; font-size: 16px; z-index: 22; pointer-events: none; white-space: nowrap; }
#toast.in { animation: toast .25s ease-out; }
@keyframes toast { from { transform: translateX(-50%) translateY(10px); opacity: 0; } }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition: none !important; } }

</style>
</head>
<body>
<div id="app">
  <canvas id="cv" aria-label="제설 작업 화면"></canvas>

  <header id="hud" hidden>
    <div class="hud-top">
      <div class="pill rank"><span id="h-ins" class="ins"></span><span class="rank-txt"><b id="h-day">1일차</b><small id="h-wx">눈</small></span></div>
      <div class="timer"><svg viewBox="0 0 44 44" aria-hidden="true"><circle class="tr-bg" cx="22" cy="22" r="19"/><circle id="h-ring" class="tr-fg" cx="22" cy="22" r="19"/></svg><b id="h-time">60</b></div>
      <div class="pill bank"><i class="pie" aria-hidden="true"></i><b id="h-bank">0</b></div>
    </div>
    <div class="prog"><div class="bar"><i id="h-fill"></i><em id="h-goal"></em></div><b id="h-pct">0%</b><button id="h-pause" class="pause" aria-label="작업 중지"><span></span><span></span></button></div>
  </header>

  <div id="say" hidden><div class="say-face" id="say-face"></div><p id="say-text"></p></div>
  <div id="banner" hidden></div>
  <div id="hint" hidden><b>화면을 누른 채 끌면 걷는다</b><span>넉가래는 알아서 민다. 톡 누르면 그쪽으로 간다.</span></div>

  <section id="title" class="screen">
    <div class="title-box">
      <p class="kicker">전역각 외전</p>
      <h1 class="logo"><span>제설각</span></h1>
      <p class="tag">눈은 하늘에서 내리는 쓰레기다</p>
      <div id="t-info" class="t-info"></div>
      <div class="t-btns">
        <button id="t-start" class="btn big">작업 개시</button>
        <button id="t-shop" class="btn ghost">보급·인력 관리</button>
      </div>
      <button id="t-sound" class="btn link">소리 켬</button>
    </div>
  </section>

  <section id="result" class="screen dim" hidden></section>

  <section id="shop" class="screen dim" hidden>
    <div class="shop">
      <header class="shop-head">
        <button id="s-back" class="back" aria-label="처음 화면으로">‹</button>
        <h2>보급·인력 관리</h2>
        <div class="pill bank light"><i class="pie" aria-hidden="true"></i><b id="s-bank">0</b></div>
      </header>
      <nav id="s-tabs" class="tabs" role="tablist"></nav>
      <div id="s-list" class="list"></div>
      <footer class="shop-foot"><button id="s-go" class="btn big">작업 개시</button></footer>
    </div>
  </section>

  <div id="modal" hidden><div class="modal-box" id="modal-box"></div></div>
  <div id="toast" hidden></div>
</div>
<script>
/* js/art.js */
/* 전역각 — 캐릭터/배경/아이콘 SVG 생성기
 * 외부 이미지 없이 전부 코드로 그린다. 컨셉: 머리 크고, 눈은 짝짝이, 어딘가 띨빵한 군인들.
 */
(function (JY) {
  'use strict';

  var uidCounter = 0;
  function uid() { uidCounter += 1; return 'jy' + uidCounter.toString(36); }

  function hash(str) {
    var h = 2166136261;
    str = String(str || 'x');
    for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function mulberry(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var INK = '#2a2620';
  var SKINS = ['#ffd9b5', '#f6c79c', '#eab386', '#f9d2a8'];

  /* ── 디지털 무늬(화강암 패턴) ─────────────────────────── */
  function camoPattern(id, seed, colors) {
    var r = mulberry(seed);
    var c = colors || ['#6d7a48', '#4d5a32', '#8c7d57', '#353a25'];
    var s = '<pattern id="' + id + '" width="36" height="36" patternUnits="userSpaceOnUse">' +
      '<rect width="36" height="36" fill="' + c[0] + '"/>';
    for (var i = 0; i < 26; i++) {
      var x = Math.floor(r() * 9) * 4, y = Math.floor(r() * 9) * 4;
      var w = 4 * (1 + Math.floor(r() * 2)), h = 4 * (1 + Math.floor(r() * 2));
      s += '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" fill="' + c[1 + Math.floor(r() * 3)] + '"/>';
    }
    return s + '</pattern>';
  }

  /* ── 얼굴 부품 ─────────────────────────────────────── */
  var EL = 76, ER = 124, EY = 96;

  function eye(cx, cy, rx, ry, px, py, pr) {
    return '<ellipse cx="' + cx + '" cy="' + cy + '" rx="' + rx + '" ry="' + ry + '" fill="#fff" stroke="' + INK + '" stroke-width="3"/>' +
      '<circle cx="' + (cx + px) + '" cy="' + (cy + py) + '" r="' + pr + '" fill="' + INK + '"/>' +
      '<circle cx="' + (cx + px - pr * 0.35) + '" cy="' + (cy + py - pr * 0.4) + '" r="' + Math.max(1.2, pr * 0.3) + '" fill="#fff"/>';
  }

  function drawEyes(type, skin) {
    var g = '';
    switch (type) {
      case 'derp':
        g = eye(EL, EY - 2, 15, 16, -5, -6, 6) + eye(ER, EY + 3, 9, 10, 3, 4, 4); break;
      case 'sleepy':
        g = eye(EL, EY, 12, 11, 0, 4, 5) + eye(ER, EY, 12, 11, 0, 4, 5) +
          '<path d="M62 92 Q76 82 90 92 L90 86 L62 86Z" fill="' + skin + '" stroke="' + INK + '" stroke-width="3" stroke-linejoin="round"/>' +
          '<path d="M110 92 Q124 82 138 92 L138 86 L110 86Z" fill="' + skin + '" stroke="' + INK + '" stroke-width="3" stroke-linejoin="round"/>' +
          '<rect x="60" y="78" width="32" height="12" fill="' + skin + '"/><rect x="108" y="78" width="32" height="12" fill="' + skin + '"/>' +
          '<path d="M63 93 Q76 99 89 93 M111 93 Q124 99 137 93" fill="none" stroke="' + INK + '" stroke-width="3" stroke-linecap="round"/>';
        break;
      case 'angry':
        g = eye(EL, EY, 11, 11, 2, 1, 5) + eye(ER, EY, 11, 11, -2, 1, 5); break;
      case 'dot':
        g = '<circle cx="' + EL + '" cy="' + EY + '" r="4.5" fill="' + INK + '"/><circle cx="' + ER + '" cy="' + EY + '" r="4.5" fill="' + INK + '"/>'; break;
      case 'wide':
        g = eye(EL, EY, 16, 17, 0, 0, 3.5) + eye(ER, EY, 16, 17, 0, 0, 3.5); break;
      case 'happy':
        g = '<path d="M64 99 Q76 84 88 99 M112 99 Q124 84 136 99" fill="none" stroke="' + INK + '" stroke-width="4" stroke-linecap="round"/>'; break;
      case 'sunglasses':
        g = '<rect x="56" y="84" width="38" height="24" rx="9" fill="#141414"/><rect x="106" y="84" width="38" height="24" rx="9" fill="#141414"/>' +
          '<path d="M94 92 L106 92" stroke="#141414" stroke-width="4"/><path d="M40 90 L56 90 M144 90 L160 90" stroke="#141414" stroke-width="3"/>' +
          '<path d="M62 90 L72 90 M112 90 L122 90" stroke="#7b8ea8" stroke-width="3" stroke-linecap="round"/>'; break;
      case 'sparkle':
        g = '<ellipse cx="' + EL + '" cy="' + EY + '" rx="13" ry="15" fill="' + INK + '"/><ellipse cx="' + ER + '" cy="' + EY + '" rx="13" ry="15" fill="' + INK + '"/>' +
          '<circle cx="71" cy="90" r="5" fill="#fff"/><circle cx="81" cy="102" r="2.5" fill="#fff"/><circle cx="119" cy="90" r="5" fill="#fff"/><circle cx="129" cy="102" r="2.5" fill="#fff"/>'; break;
      case 'smug':
        g = eye(EL, EY, 12, 10, 5, 2, 4.5) + eye(ER, EY, 12, 10, 5, 2, 4.5) +
          '<rect x="60" y="82" width="32" height="10" fill="' + skin + '"/><rect x="108" y="82" width="32" height="10" fill="' + skin + '"/>' +
          '<path d="M63 92 L89 92 M111 92 L137 92" stroke="' + INK + '" stroke-width="3.5" stroke-linecap="round"/>'; break;
      case 'cross':
        g = '<path d="M66 86 L86 106 M86 86 L66 106 M114 86 L134 106 M134 86 L114 106" stroke="' + INK + '" stroke-width="4.5" stroke-linecap="round"/>'; break;
      case 'teary':
        g = eye(EL, EY, 13, 14, 0, -2, 6) + eye(ER, EY, 13, 14, 0, -2, 6) +
          '<path class="tear" d="M70 110 Q66 130 70 150 L76 150 Q78 130 78 110Z M122 110 Q120 130 124 150 L130 150 Q134 130 130 110Z" fill="#7cc4f2" opacity=".85"/>'; break;
      case 'spiral':
        g = '<circle cx="' + EL + '" cy="' + EY + '" r="14" fill="#fff" stroke="' + INK + '" stroke-width="3"/><circle cx="' + ER + '" cy="' + EY + '" r="14" fill="#fff" stroke="' + INK + '" stroke-width="3"/>' +
          '<path d="M76 96 m0 -2 a2 2 0 1 1 -2 2 a5 5 0 1 1 5 5 a8 8 0 1 1 -8 -8" fill="none" stroke="' + INK + '" stroke-width="2.4"/>' +
          '<path d="M124 96 m0 -2 a2 2 0 1 1 -2 2 a5 5 0 1 1 5 5 a8 8 0 1 1 -8 -8" fill="none" stroke="' + INK + '" stroke-width="2.4"/>'; break;
      default:
        g = eye(EL, EY, 11, 12, 0, 1, 5) + eye(ER, EY, 11, 12, 0, 1, 5);
    }
    return '<g class="eyes">' + g + '</g>';
  }

  function drawBrows(type) {
    var s = 'fill="none" stroke="' + INK + '" stroke-linecap="round"';
    switch (type) {
      case 'thick': return '<path d="M60 76 Q76 66 92 74 M108 74 Q124 66 140 76" ' + s + ' stroke-width="8"/>';
      case 'angry': return '<path d="M60 70 L90 80 M140 70 L110 80" ' + s + ' stroke-width="6"/>';
      case 'worried': return '<path d="M62 80 L90 70 M138 80 L110 70" ' + s + ' stroke-width="5"/>';
      case 'uni': return '<path d="M58 76 Q70 66 84 74 Q100 80 116 74 Q130 66 142 76" ' + s + ' stroke-width="8"/>';
      case 'up': return '<path d="M62 70 Q76 60 90 68 M110 68 Q124 60 138 70" ' + s + ' stroke-width="4"/>';
      case 'none': return '';
      default: return '<path d="M64 76 Q76 70 88 75 M112 75 Q124 70 136 76" ' + s + ' stroke-width="4"/>';
    }
  }

  function drawMouth(type) {
    var st = 'stroke="' + INK + '" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"';
    switch (type) {
      case 'grin':

  function rankPatch(rank, x, y) {
    var s = '';
    if (!rank) return '';
    if (/^e[0-4]$/.test(rank)) {
      var n = +rank[1];
      s += '<rect x="' + x + '" y="' + y + '" width="22" height="16" rx="2" fill="#4a5130" stroke="' + INK + '" stroke-width="1.5"/>';
      if (n === 0) s += '<text x="' + (x + 11) + '" y="' + (y + 12) + '" font-size="9" text-anchor="middle" fill="#e8e2c4" font-weight="700">훈</text>';
      for (var i = 0; i < n; i++) s += '<rect x="' + (x + 3) + '" y="' + (y + 2.5 + i * 3.2) + '" width="16" height="2" fill="#111"/>';
    } else if (rank === 'o1' || rank === 'o3') {
      var k = rank === 'o1' ? 1 : 3;
      s += '<rect x="' + (x - 4) + '" y="' + y + '" width="30" height="16" rx="2" fill="#4a5130" stroke="' + INK + '" stroke-width="1.5"/>';
      for (var j = 0; j < k; j++) {
        var cx = x + 11 + (j - (k - 1) / 2) * 8;
        s += '<path d="M' + cx + ' ' + (y + 3) + ' L' + (cx + 3.5) + ' ' + (y + 8) + ' L' + cx + ' ' + (y + 13) + ' L' + (cx - 3.5) + ' ' + (y + 8) + 'Z" fill="#111"/>';
      }
    } else if (rank === 'nco') {
      s += '<rect x="' + x + '" y="' + y + '" width="22" height="16" rx="2" fill="#4a5130" stroke="' + INK + '" stroke-width="1.5"/>';
      for (var q = 0; q < 3; q++) s += '<path d="M' + (x + 4) + ' ' + (y + 4 + q * 3.5) + ' L' + (x + 11) + ' ' + (y + 7 + q * 3.5) + ' L' + (x + 18) + ' ' + (y + 4 + q * 3.5) + '" fill="none" stroke="#111" stroke-width="1.6"/>';
    } else if (rank === 'gen') {
      s += '<rect x="' + (x - 6) + '" y="' + y + '" width="34" height="16" rx="2" fill="#1d2414" stroke="' + INK + '" stroke-width="1.5"/>' +
        star(x + 4, y + 8, 5, '#ffd34d') + star(x + 18, y + 8, 5, '#ffd34d');
    }
    return s;
  }

  function star(cx, cy, r, fill) {
    var p = '';
    for (var i = 0; i < 10; i++) {
      var a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
      p += (i ? 'L' : 'M') + (cx + Math.cos(a) * rr).toFixed(1) + ' ' + (cy + Math.sin(a) * rr).toFixed(1);
    }
    return '<path d="' + p + 'Z" fill="' + fill + '" stroke="#7a5a00" stroke-width="1"/>';
  }

    if (X) X.rank();
    V.shake(3);
    modal('<div class="m-rank"><div class="m-ins">' + insignia(r) + '</div><p class="kicker">진급을 축하한다</p><h3>' + S.RANKS[r].name + ' 진급!</h3>' +
      (unlocked.length ? '<p>새로 부려 먹을 수 있다: <b>' + unlocked.join(', ') + '</b></p>' : '<p>짬이 찼다. 이제 시키는 쪽이다.</p>') +
      '<button class="btn big" data-m="ok">충성!</button></div>');
  }

  /* ── 보급·인력 ── */
  var TABS = [['crew', '인력'], ['tool', '도구'], ['perk', '보급'], ['zone', '구역'], ['dis', '전역']];
  var PERK_ICON = {
    eisen: '<path d="M5 6h7v6l6 2a3 3 0 0 1 3 3v1H5z" fill="#3b3f33"/><path d="M6 19l1 3M10 19l1 3M14 19l1 3M18 19l1 3" stroke="#9aa3ab" stroke-width="1.6" stroke-linecap="round"/>',
    hotpack: '<rect x="5" y="6" width="14" height="14" rx="3" fill="#e4572e"/><path d="M9 3c-1 1 1 2 0 3M12 3c-1 1 1 2 0 3M15 3c-1 1 1 2 0 3" stroke="#e4572e" stroke-width="1.4" fill="none"/><rect x="8" y="10" width="8" height="5" rx="1" fill="#fff3"/>',
    matsta: '<rect x="7" y="3" width="10" height="18" rx="2" fill="#2f8f5b"/><rect x="7" y="8" width="10" height="7" fill="#f4d35e"/><rect x="9" y="1.5" width="6" height="2" rx="1" fill="#9aa3ab"/>',
    praise: '<path d="M12 2l2.9 6.2 6.6.6-5 4.5 1.5 6.6L12 16.6 6 19.9l1.5-6.6-5-4.5 6.6-.6z" fill="#ffd24a" stroke="#b8901a" stroke-width="1"/>',
    song: '<path d="M4 9h4l6-5v16l-6-5H4z" fill="#4d5b31"/><path d="M17 8a5 5 0 0 1 0 8M19.5 5.5a8.5 8.5 0 0 1 0 13" stroke="#4d5b31" stroke-width="1.8" fill="none" stroke-linecap="round"/>',
    gear: '<path d="M6 20L16 6" stroke="#8a6a44" stroke-width="2.2" stroke-linecap="round"/><rect x="13" y="2" width="9" height="5" rx="1.5" transform="rotate(35 17 4)" fill="#e7ae2f"/><path d="M18 20L8 6" stroke="#8a6a44" stroke-width="2.2" stroke-linecap="round"/><rect x="2" y="2" width="9" height="5" rx="1.5" transform="rotate(-35 7 4)" fill="#e7ae2f"/>'
  };

  function iconCanvas(draw) {
    var c = document.createElement('canvas'), k = 2; c.width = 56 * k; c.height = 56 * k; c.className = 'ico-cv';
    var x = c.getContext('2d'); x.scale(k, k); draw(x); return c;
  }
  function person(opts, scale) {
    return iconCanvas(function (x) {
      x.translate(28, 49); x.scale(scale || 1.55, scale || 1.55);
      V._drawPerson(x, { x: 0, y: 0, dir: { x: 0.45, y: 0.89 }, walk: 0, moving: false, swing: 0 }, opts);
    });
  }
  function vehicle(kind, r) {
    return iconCanvas(function (x) {
      x.translate(24, 38); x.scale(0.82, 0.82);
      V._drawVehicle(x, { x: 0, y: 0, dir: { x: 0.85, y: -0.5 } }, { kind: kind, r: Math.min(r, 40) });
    });
  }
  function itemIcon(o) {
    if (o.kind === 'crew') {
      var C = S.CREW.filter(function (c) { return c.id === o.id; })[0];
      if (C.vehicle) return vehicle('plow', 30);
      return person({ coat: C.coat, hat: C.hat, seed: 5, tool: C.id === 'cook' ? 'shovel' : C.id === 'hoobae' ? 'broom' : 'pusher', r: C.r });
    }
    if (o.kind === 'tool') {
      var T = S.TOOLS[o.i];
      if (T.vehicle) return vehicle(T.id, T.r);
      if (T.id === 'salt') return person({ coat: '#5b6a3a', hat: 'beanie', seed: 3, salt: true });
      return person({ coat: '#5b6a3a', hat: 'beanie', seed: 3, tool: V._toolKind(T), r: T.r, band: true });
    }
    if (o.kind === 'zone') {
      var Z = S.ZONES.filter(function (z) { return z.id === o.id; })[0];
      return iconCanvas(function (x) {
        x.fillStyle = '#dfe7ee'; x.fillRect(4, 4, 48, 48);
        var k = 44 / Math.max(S.W, S.H);
        S.ZONES.forEach(function (z) { x.fillStyle = z.id === Z.id ? '#ffd24a' : save.zones[z.id] ? '#8a98a6' : '#c3ccd5'; x.fillRect(4 + (48 - S.W * k) / 2 + z.x * k, 6 + z.y * k, Math.max(2, z.w * k), Math.max(2, z.h * k)); });
        x.strokeStyle = '#4d5b31'; x.lineWidth = 1.5; x.strokeRect(4, 4, 48, 48);
      });
    }
    var d = document.createElement('div'); d.className = 'ico-svg';
    d.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + (PERK_ICON[o.id] || '') + '</svg>';
    return d;
  }

  function shop() {
    show('shop');
    V.demo(save);
    renderShop();
  }

  function renderShop() {
    $('s-bank').textContent = fmt(save.bank);
    $('s-go').textContent = save.day + '일차 작업 개시';
    var showDis = G.rankOf(save) >= 3 || save.discharges > 0;
    $('s-tabs').innerHTML = TABS.filter(function (t) { return t[0] !== 'dis' || showDis; }).map(function (t) {
      var o = t[0] === 'dis' ? [] : G.offers(save)[t[0]], n = o.filter(function (x) { return x.ok; }).length;
      return '<button role="tab" aria-selected="' + (tab === t[0]) + '" data-tab="' + t[0] + '">' + t[1] + (n ? '<i class="dot">' + n + '</i>' : '') + '</button>';
    }).join('');
    var list = $('s-list'); list.innerHTML = '';
    if (tab === 'dis') { renderDischarge(list); return; }
    var items = G.offers(save)[tab];
    if (!items.length) { list.innerHTML = '<p class="empty">모든 구역을 맡았다. 이제 부대 전체가 우리 담당이다.</p>'; return; }
    items.forEach(function (o) {
      var row = document.createElement('div');
      row.className = 'item s-' + o.state + (o.ok ? ' can' : '');
      var meta = o.kind === 'crew' ? o.tag + ' · ' + o.n + '/' + o.max + '명' : o.kind === 'perk' ? 'Lv ' + o.n + '/' + o.max : o.kind === 'tool' ? o.stat : '';
      var label;
      if (o.state === 'buy') label = pie() + fmt(o.cost);
      else if (o.state === 'own') label = o.cur ? '사용 중' : '보유';
      else if (o.state === 'max') label = '최대';
      else if (o.state === 'later') label = '다음 단계';
      else label = esc(o.lockText);
      var ico = document.createElement('div'); ico.className = 'ico'; ico.appendChild(itemIcon(o));
      row.appendChild(ico);
      var info = document.createElement('div'); info.className = 'info';
      info.innerHTML = '<b>' + esc(o.name) + '</b>' + (meta ? '<small>' + esc(meta) + '</small>' : '') + '<p>' + esc(o.desc) + '</p>';
      row.appendChild(info);
      var btn = document.createElement('button'); btn.className = 'buy'; btn.innerHTML = label;
      btn.disabled = o.state !== 'buy';
      if (o.state === 'buy' && !o.ok) btn.classList.add('short');
      btn.setAttribute('data-kind', o.kind); btn.setAttribute('data-id', o.id);
      row.appendChild(btn);
      list.appendChild(row);
    });
  }

  function renderDischarge(list) {
    var can = G.canDischarge(save), p = Math.min(1, save.life / S.DISCHARGE_LIFE), gain = G.medalGain(save);
    list.innerHTML = '<div class="dis"><div class="dis-ins">' + insignia(3) + '</div><h3>전역 신고</h3>' +
      '<p>지금까지 번 초코파이로 전역 메달을 받는다. 처음(이병, 싸리비)부터 다시 시작하지만 <b>메달 하나마다 모든 보상이 +10%</b> 영원히 늘어난다.</p>' +
      '<div class="dis-bar"><i style="width:' + Math.round(p * 100) + '%"></i></div><p class="dis-num">' + fmt(save.life) + ' / ' + fmt(S.DISCHARGE_LIFE) + ' (병장 + 누적 초코파이)</p>' +
      '<ul class="res-lines"><li><span>지금 메달</span><b>' + save.medals + '개</b></li><li><span>이번 전역으로 받는 메달</span><b>+' + (can ? gain : 0) + '개</b></li></ul>' +
      '<button class="btn big" id="dis-go"' + (can ? '' : ' disabled') + '>' + (can ? '전역 신고하기' : '아직 전역할 때가 아니다') + '</button></div>';
    var go = $('dis-go');
    if (go) go.onclick = function () {
      modal('<div class="m-rank"><p class="kicker">정말 전역?</p><h3>전역 신고</h3><p>초코파이, 도구, 인력, 구역이 모두 처음으로 돌아간다. 전역 메달 <b>+' + gain + '개</b>를 받는다.</p><div class="res-btns"><button class="btn ghost" data-m="no">조금 더 한다</button><button class="btn big" data-m="yes">충성! 전역합니다</button></div></div>', function (k) {
        if (k !== 'yes') return;
        var r = G.discharge(save); persist();
        if (X) X.rank();
        modal('<div class="m-rank"><div class="m-ins">' + insignia(3) + '</div><p class="kicker">전역을 축하한다</p><h3>전역 메달 +' + r.medals + '</h3><p>메달 ' + r.total + '개 · 모든 보상 +' + r.total * 10 + '%. 그리고… 새 이병으로 재입대했다.</p><button class="btn big" data-m="ok">다시 싸리비를 든다</button></div>', function () { tab = 'crew'; title(); });
      });
    };
  }

  function onShopClick(e) {
    var t = e.target.closest('[data-tab]');
    if (t) { tab = t.getAttribute('data-tab'); renderShop(); $('s-list').scrollTop = 0; return; }
    var b = e.target.closest('.buy');
    if (!b) return;
    var kind = b.getAttribute('data-kind'), id = b.getAttribute('data-id');
    var r = G.buy(save, kind, id);
    if (!r.ok) { if (X) X.deny(); b.classList.remove('nope'); void b.offsetWidth; b.classList.add('nope'); return; }
    if (X) X.buy();
    persist();
    toast(esc(r.item.name) + (kind === 'crew' ? ' 투입!' : kind === 'zone' ? ' 담당!' : kind === 'tool' ? ' 지급!' : ' 보급!'));
    if (kind === 'crew' && Math.random() < 0.5) say('hire', 2000);
    if (kind === 'tool') say('tool', 2000);
    if (kind === 'zone') say('zone', 2000);
    renderShop();
  }

  /* ── 시작 ── */
  function boot() {
    V.init($('cv'), { say: function (k) { say(k); }, tick: tick, done: dayDone });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { V.rebuildArt(); });
    $('say-face').innerHTML = haengFace();
    $('t-start').onclick = startDay;
    $('t-shop').onclick = shop;
    $('t-sound').onclick = function () { if (!X) return; X.setMuted(!X.muted()); $('t-sound').textContent = X.muted() ? '소리 끔' : '소리 켬'; if (!X.muted()) { X.unlock(); X.pop(); } };
    $('s-go').onclick = startDay;
    $('s-back').onclick = title;
    $('shop').addEventListener('click', onShopClick);
    $('h-pause').onclick = pause;
    document.addEventListener('visibilitychange', function () { if (document.hidden && V.mode() === 'play') pause(); });
    var off = G.offline(save, Date.now());
    title();
    if (off > 0) {
      save.bank += off; save.life += off;
      modal('<div class="m-rank"><div class="m-face">' + haengFace() + '</div><p class="kicker">당직 서는 동안</p><h3>후임들이 눈을 치웠다</h3><p class="m-big">' + pie() + '+' + fmt(off) + '</p><p>쉬는 동안에도 인력은 일한다. 그게 군대다.</p><button class="btn big" data-m="ok">수고했다</button></div>');
    }
    save.last = Date.now(); persist();
  }

  function pause() {
    if (V.mode() !== 'play') return;
    V.pause(true);
    modal('<div class="m-rank"><p class="kicker">잠깐</p><h3>작업 중지</h3><p>지금 그만두면 지금까지 치운 만큼만 검열받는다.</p><div class="res-btns"><button class="btn ghost" data-m="quit">여기까지</button><button class="btn big" data-m="go">계속 치운다</button></div></div>', function (k) {
      V.pause(false);
      if (k === 'quit') { var w = V.world(); w.time = w.dayLen; }
    });
  }

  window.__SNOW = {
    save: function () { return save; },
    setSave: function (s) { save = G.migrate(s); persist(); },
    startDay: startDay, shop: shop, title: title, endNow: function () { var w = V.world(); if (w) w.time = w.dayLen; },
    autopilot: V.setAutopilot
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})(window.JY = window.JY || {});

</script>
</body>
</html>
