<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#16233a">
<title>제설각</title>
<link rel="icon" href="icons/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap">
<link rel="stylesheet" href="css/snow.css">
</head>
<body>
<!-- build:body -->
<div id="app">
  <canvas id="cv" aria-label="제설 작업 화면"></canvas>

  <header id="hud" hidden>
    <div class="hud-top">
      <div class="pill rank"><span id="h-ins" class="ins"></span><span class="rank-txt"><b id="h-day">1일차</b><small id="h-wx">눈</small></span></div>
      <div class="timer"><svg viewBox="0 0 44 44" aria-hidden="true"><circle class="tr-bg" cx="22" cy="22" r="19"/><circle id="h-ring" class="tr-fg" cx="22" cy="22" r="19"/></svg><b id="h-time">60</b></div>
      <div class="pill bank"><i class="pie" aria-hidden="true"></i><b id="h-bank">0</b></div>
    </div>
    <div class="prog"><div class="bar"><i id="h-fill"></i><em id="h-goal"></em></div><b id="h-pct">0%</b><button id="h-pause" class="pause" aria-label="작업 중지"><span></span><span></span></button></div>
  </header>

  <div id="say" hidden><div class="say-face" id="say-face"></div><p id="say-text"></p></div>
  <div id="banner" hidden></div>
  <div id="hint" hidden><b>화면을 누른 채 끌면 걷는다</b><span>넉가래는 알아서 민다. 톡 누르면 그쪽으로 간다.</span></div>

  <section id="title" class="screen">
    <div class="title-box">
      <p class="kicker">전역각 외전</p>
      <h1 class="logo"><span>제설각</span></h1>
      <p class="tag">눈은 하늘에서 내리는 쓰레기다</p>
      <div id="t-info" class="t-info"></div>
      <div class="t-btns">
        <button id="t-start" class="btn big">작업 개시</button>
        <button id="t-shop" class="btn ghost">보급·인력 관리</button>
      </div>
      <button id="t-sound" class="btn link">소리 켬</button>
    </div>
  </section>

  <section id="result" class="screen dim" hidden></section>

  <section id="shop" class="screen dim" hidden>
    <div class="shop">
      <header class="shop-head">
        <button id="s-back" class="back" aria-label="처음 화면으로">‹</button>
        <h2>보급·인력 관리</h2>
        <div class="pill bank light"><i class="pie" aria-hidden="true"></i><b id="s-bank">0</b></div>
      </header>
      <nav id="s-tabs" class="tabs" role="tablist"></nav>
      <div id="s-list" class="list"></div>
      <footer class="shop-foot"><button id="s-go" class="btn big">작업 개시</button></footer>
    </div>
  </section>

  <div id="modal" hidden><div class="modal-box" id="modal-box"></div></div>
  <div id="toast" hidden></div>
</div>
<!-- /build:body -->
<script src="js/art.js"></script>
<script src="js/data/chars.js"></script>
<script src="js/snow/data.js"></script>
<script src="js/snow/sim.js"></script>
<script src="js/snow/sfx.js"></script>
<script src="js/snow/view.js"></script>
<script src="js/snow/ui.js"></script>
</body>
</html>
